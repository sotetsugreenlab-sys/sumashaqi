name: iPorter注文取得

on:
  schedule:
    - cron: '0 21 * * *'  # 毎日 06:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-orders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Puppeteerインストール
        run: npm install puppeteer

      - name: 注文データ取得
        env:
          IPORTER_USER_ID: ${{ secrets.IPORTER_USER_ID }}
          IPORTER_PASSWORD: ${{ secrets.IPORTER_PASSWORD }}
        run: |
          node << 'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');

          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 800 });

            // ログイン
            await page.goto('https://iporter.nehops.com/ybs/', {
              waitUntil: 'networkidle0', timeout: 30000
            });

            // ホテル選択・ID・パスワード入力
            await page.select('select', '1');
            const inputs = await page.$$('input[type="text"], input:not([type])');
            for (const input of inputs) {
              const type = await input.evaluate(el => el.type);
              if (type === 'text' || type === '') {
                await input.type(process.env.IPORTER_USER_ID);
                break;
              }
            }
            const passInput = await page.$('input[type="password"]');
            if (passInput) await passInput.type(process.env.IPORTER_PASSWORD);

            const loginBtn = await page.$('input[type="submit"], button[type="submit"]');
            if (loginBtn) await loginBtn.click();
            await page.waitForNavigation({ waitUntil: 'networkidle0', timeout: 15000 });

            // フレーム対応: 受注一覧リンクを探す
            let orderListUrl = null;
            const frames = page.frames();
            for (const frame of frames) {
              try {
                const links = await frame.$$eval('a', els =>
                  els.map(el => ({ text: el.textContent.trim(), href: el.href }))
                );
                const orderLink = links.find(l => l.text.includes('受注一覧'));
                if (orderLink) {
                  orderListUrl = orderLink.href;
                  break;
                }
              } catch(e) {}
            }

            let orders = [];
            let error = null;

            if (orderListUrl) {
              // 受注一覧ページに直接アクセス
              await page.goto(orderListUrl, { waitUntil: 'networkidle0', timeout: 15000 });
              await new Promise(r => setTimeout(r, 1000));

              // フレームを再取得してフォーム操作
              const allFrames = page.frames();
              let targetFrame = page;
              for (const frame of allFrames) {
                try {
                  const hasForm = await frame.$('input[type="submit"]');
                  if (hasForm) { targetFrame = frame; break; }
                } catch(e) {}
              }

              // 納品予定日を選択
              const radios = await targetFrame.$$('input[type="radio"]');
              for (const radio of radios) {
                const val = await radio.evaluate(el => el.value || el.id);
                if (val && val.includes('2')) { // 2番目のラジオ = 納品予定日
                  await radio.click();
                  break;
                }
              }

              // 今日から14日後の日付を設定
              const today = new Date();
              const future = new Date();
              future.setDate(today.getDate() + 14);

              // 日付セレクト (年/月/日)
              const selects = await targetFrame.$$('select');
              if (selects.length >= 3) {
                await selects[0].select(String(future.getFullYear()));
                await selects[1].select(String(future.getMonth() + 1));
                await selects[2].select(String(future.getDate()));
              }

              // 一覧表示ボタンクリック
              const submitBtn = await targetFrame.$('input[type="submit"]');
              if (submitBtn) {
                await submitBtn.click();
                await new Promise(r => setTimeout(r, 3000));
              }

              // テーブルデータ取得
              const allFrames2 = page.frames();
              for (const frame of allFrames2) {
                try {
                  const tableData = await frame.evaluate(() => {
                    const tables = document.querySelectorAll('table');
                    for (const table of tables) {
                      const rows = table.querySelectorAll('tr');
                      if (rows.length < 2) continue;
                      const headers = Array.from(rows[0].querySelectorAll('th,td')).map(el => el.textContent.trim());
                      if (!headers.some(h => h.includes('品') || h.includes('数') || h.includes('納品'))) continue;
                      const data = [];
                      for (let i = 1; i < rows.length; i++) {
                        const cells = Array.from(rows[i].querySelectorAll('td')).map(el => el.textContent.trim());
                        if (cells.length === 0) continue;
                        const obj = {};
                        headers.forEach((h, idx) => { if (cells[idx]) obj[h] = cells[idx]; });
                        data.push(obj);
                      }
                      return { headers, data };
                    }
                    return null;
                  });
                  if (tableData && tableData.data.length > 0) {
                    orders = tableData.data;
                    break;
                  }
                } catch(e) {}
              }
            } else {
              error = '受注一覧リンクが見つかりませんでした';
            }

            await browser.close();

            // JSON保存
            const result = {
              updated_at: new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' }),
              orders,
              error
            };
            fs.writeFileSync('orders.json', JSON.stringify(result, null, 2));
            console.log('Orders saved:', orders.length, 'items');
          })();
          EOF

      - name: コミット＆プッシュ
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add orders.json
          git diff --staged --quiet || git commit -m "🛒 注文データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push
