name: iPorter注文取得

on:
  schedule:
    - cron: '0 21 * * *'  # 毎日 06:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-orders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Puppeteerインストール
        run: npm install puppeteer

      - name: 注文データ取得
        env:
          IPORTER_USER_ID: ${{ secrets.IPORTER_USER_ID }}
          IPORTER_PASSWORD: ${{ secrets.IPORTER_PASSWORD }}
        run: |
          node << 'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');

          async function getText(frame) {
            try { return await frame.evaluate(() => document.body?.innerText || ''); }
            catch(e) { return ''; }
          }

          async function waitFrame(page, keyword, ms = 10000) {
            const end = Date.now() + ms;
            while (Date.now() < end) {
              for (const frame of page.frames()) {
                if ((await getText(frame)).includes(keyword)) return frame;
              }
              await new Promise(r => setTimeout(r, 500));
            }
            return null;
          }

          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox', '--disable-setuid-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 900 });

            // ログイン
            await page.goto('https://iporter.nehops.com/ybs/', { waitUntil: 'networkidle0', timeout: 30000 });
            try { await page.select('select', '1'); } catch(e) {}
            for (const input of await page.$$('input')) {
              if (await input.evaluate(el => el.type) === 'text') {
                await input.type(process.env.IPORTER_USER_ID); break;
              }
            }
            const pw = await page.$('input[type="password"]');
            if (pw) await pw.type(process.env.IPORTER_PASSWORD);
            await Promise.all([
              page.waitForNavigation({ waitUntil: 'networkidle0', timeout: 15000 }),
              page.click('input[type="submit"]')
            ]);
            console.log('ログイン完了');
            await new Promise(r => setTimeout(r, 3000));

            // トップメニューの「受注」をクリック
            const topmenu = await waitFrame(page, 'ログアウト', 10000);
            if (!topmenu) { console.log('topmenuなし'); await browser.close(); return; }
            await topmenu.evaluate(() => {
              for (const el of document.querySelectorAll('a')) {
                if (el.textContent.trim() === '受注') { el.click(); return; }
              }
            });
            console.log('受注クリック完了');
            await new Promise(r => setTimeout(r, 4000));

            // サブメニューの「受注データ処理」をクリック
            const submenu = await waitFrame(page, '受注データ処理', 10000);
            if (!submenu) { console.log('submenuなし'); await browser.close(); return; }
            await submenu.evaluate(() => {
              for (const el of document.querySelectorAll('a,button,input')) {
                if ((el.textContent || el.value || '').includes('受注データ処理')) { el.click(); return; }
              }
            });
            console.log('受注データ処理クリック完了');

            // 受注状況確認が読み込まれるまで待つ（最大20秒）
            await new Promise(r => setTimeout(r, 10000));

            // 全フレームを確認
            let orderFrame = null;
            for (const frame of page.frames()) {
              const t = await getText(frame);
              const preview = t.slice(0, 80).replace(/\n/g, ' ');
              if (preview) console.log('frame:', preview);
              if (t.includes('受注状況確認') || t.includes('伝票番号')) {
                orderFrame = frame;
              }
            }

            if (!orderFrame) {
              console.log('注文一覧フレームなし');
              await browser.close();
              return;
            }

            // テーブルから注文を取得（伝票番号・希望納品日・受注ステータス）
            const allOrders = await orderFrame.evaluate(() => {
              const results = [];
              const seen = new Set();
              const rows = document.querySelectorAll('table tr');
              for (const row of rows) {
                const cells = Array.from(row.querySelectorAll('td')).map(td => td.innerText.trim());
                const denpyo = cells.find(c => /^\d{6,8}$/.test(c));
                const date = cells.find(c => /^\d{4}\/\d{2}\/\d{2}$/.test(c));
                if (denpyo && date && !seen.has(denpyo)) {
                  seen.add(denpyo);
                  const statusCell = Array.from(row.querySelectorAll('td')).slice(-1)[0];
                  const status = statusCell?.innerText.trim() || '';
                  // 発注部門を取得（短い文字列のみ対象）
                  const dept = cells.find(c => c.length < 30 && (c.includes('購買') || c.includes('調理') || c.match(/\(\d{4}\)/))) || '';
                  results.push({
                    order_id: denpyo,
                    delivery_date: date,
                    is_new: status.includes('未処理') || status.includes('未受注'),
                    dept,
                    hotel: '横浜ベイシェラトンホテル&タワーズ',
                    items: [],
                    total: ''
                  });
                }
              }
              return results;
            });
            // 購買(6105)のみ抽出（エコデシックの注文）
            const orders = allOrders.filter(o => o.dept.includes('購買') || o.dept.includes('6105'));
            console.log(`全注文: ${allOrders.length}件、購買注文: ${orders.length}件`);

            console.log(`取得完了: ${orders.length}件`);
            orders.forEach(o => console.log('注文:', o.order_id, o.delivery_date, o.is_new ? '未処理' : '処理済'));

            if (orders.length === 0) { await browser.close(); return; }

            // 既存データとマージ
            let existing = { orders: [] };
            try { existing = JSON.parse(fs.readFileSync('orders.json', 'utf8')); } catch(e) {}
            const existingIds = new Set(existing.orders.map(o => o.order_id));
            for (const o of orders) {
              const { dept, ...orderData } = o;
              if (!existingIds.has(o.order_id)) {
                existing.orders.unshift(orderData);
              } else {
                const idx = existing.orders.findIndex(e => e.order_id === o.order_id);
                if (idx >= 0) existing.orders[idx].is_new = o.is_new;
              }
            }

            fs.writeFileSync('orders.json', JSON.stringify({
              updated_at: new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' }),
              orders: existing.orders
            }, null, 2));

            await browser.close();
          })();
          EOF

      - name: コミット＆プッシュ
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add orders.json
          git diff --staged --quiet || git commit -m "🛒 注文データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push
