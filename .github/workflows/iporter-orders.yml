name: iPorter注文取得

on:
  schedule:
    - cron: '0 21 * * *'  # 毎日 06:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-orders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Puppeteerインストール
        run: npm install puppeteer

      - name: 注文データ取得
        env:
          IPORTER_USER_ID: ${{ secrets.IPORTER_USER_ID }}
          IPORTER_PASSWORD: ${{ secrets.IPORTER_PASSWORD }}
        run: |
          node << 'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');

          async function getText(frame) {
            try { return await frame.evaluate(() => document.body?.innerText || ''); }
            catch(e) { return ''; }
          }

          async function findFrame(page, keyword) {
            for (const frame of page.frames()) {
              if ((await getText(frame)).includes(keyword)) return frame;
            }
            return null;
          }

          async function waitFrame(page, keyword, ms = 8000) {
            const end = Date.now() + ms;
            while (Date.now() < end) {
              const f = await findFrame(page, keyword);
              if (f) return f;
              await new Promise(r => setTimeout(r, 500));
            }
            return null;
          }

          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox', '--disable-setuid-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 900 });

            // ログイン
            await page.goto('https://iporter.nehops.com/ybs/', { waitUntil: 'networkidle0', timeout: 30000 });
            try { await page.select('select', '1'); } catch(e) {}
            for (const input of await page.$$('input')) {
              if (await input.evaluate(el => el.type) === 'text') {
                await input.type(process.env.IPORTER_USER_ID); break;
              }
            }
            const pw = await page.$('input[type="password"]');
            if (pw) await pw.type(process.env.IPORTER_PASSWORD);
            await Promise.all([
              page.waitForNavigation({ waitUntil: 'networkidle0', timeout: 15000 }),
              page.click('input[type="submit"]')
            ]);
            console.log('ログイン完了');
            await new Promise(r => setTimeout(r, 3000));

            // topmenuの「受注」リンクをクリック
            const topmenu = await waitFrame(page, '受注', 10000);
            if (!topmenu) { console.log('topmenuフレームなし'); await browser.close(); return; }
            await topmenu.evaluate(() => {
              for (const el of document.querySelectorAll('a')) {
                if (el.textContent.trim() === '受注') { el.click(); return; }
              }
            });
            console.log('受注クリック完了');
            await new Promise(r => setTimeout(r, 3000));

            // サブメニューの「受注データ処理」をクリック
            const submenu = await waitFrame(page, '受注データ処理', 10000);
            if (!submenu) { console.log('submenuフレームなし'); await browser.close(); return; }
            await submenu.evaluate(() => {
              for (const el of document.querySelectorAll('a,button')) {
                if (el.textContent.includes('受注データ処理')) { el.click(); return; }
              }
            });
            await new Promise(r => setTimeout(r, 3000));

            // 注文一覧を収集
            const orders = [];
            let attempts = 10;

            while (attempts-- > 0) {
              const frame = await waitFrame(page, '伝票番号', 5000);
              if (!frame) break;

              const order = await frame.evaluate(() => {
                const text = document.body.innerText;
                if (!text.includes('伝票番号')) return null;

                // 伝票番号
                const denpyoMatch = text.match(/(\d{6,8})\s*\n/);
                const denpyo = denpyoMatch ? denpyoMatch[1] : '';

                // 各フィールド
                const getField = (label) => {
                  const m = text.match(new RegExp(label + '[\\s\\S]{0,5}?([^\\n]+)'));
                  return m ? m[1].trim() : '';
                };

                // 商品テーブル
                const rows = Array.from(document.querySelectorAll('table tr'));
                const items = [];
                for (const row of rows) {
                  const cells = Array.from(row.querySelectorAll('td')).map(td => td.innerText.trim());
                  if (cells.length >= 6 && /^\d+$/.test(cells[0]) && cells[1].length > 3) {
                    items.push({ no: cells[0], name: cells[1], qty: cells[2], unit_price: cells[4], amount: cells[5] });
                  }
                }

                const isNew = text.includes('未受注');
                const delivMatch = text.match(/納品希望日[\s\S]*?(\d{4}\/\d{2}\/\d{2})/);
                const hotelMatch = text.match(/発注ホテル[\s\S]*?([^\n]+ホテル[^\n]*)/);
                const totalMatch = text.match(/合計\s+([\d,]+円)/);

                return {
                  order_id: denpyo,
                  is_new: isNew,
                  delivery_date: delivMatch ? delivMatch[1] : '',
                  hotel: hotelMatch ? hotelMatch[1].trim() : '横浜ベイシェラトンホテル&タワーズ',
                  items,
                  total: totalMatch ? totalMatch[1] : '',
                };
              });

              if (!order || !order.order_id) break;
              console.log('注文取得:', order.order_id, '未受注:', order.is_new);

              if (!orders.find(o => o.order_id === order.order_id)) {
                orders.push(order);
              }

              // 次の未受注へ
              const next = await frame.evaluate(() => {
                for (const btn of document.querySelectorAll('button,input[type=button],input[type=submit]')) {
                  if ((btn.value || btn.textContent).includes('次の未受注') ||
                      (btn.value || btn.textContent).includes('次の伝票')) {
                    btn.click(); return true;
                  }
                }
                return false;
              });
              if (!next) break;
              await new Promise(r => setTimeout(r, 2000));
            }

            console.log(`取得完了: ${orders.length}件`);

            // 既存データとマージ
            let existing = { orders: [] };
            try { existing = JSON.parse(fs.readFileSync('orders.json', 'utf8')); } catch(e) {}
            const existingIds = new Set(existing.orders.map(o => o.order_id));
            for (const o of orders) {
              if (!existingIds.has(o.order_id)) existing.orders.unshift(o);
            }

            fs.writeFileSync('orders.json', JSON.stringify({
              updated_at: new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' }),
              orders: existing.orders
            }, null, 2));

            await browser.close();
          })();
          EOF

      - name: コミット＆プッシュ
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add orders.json
          git diff --staged --quiet || git commit -m "🛒 注文データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push
