name: 棚管理スクリーンショット

on:
  schedule:
    - cron: '0 23 * * *'  # 毎日 08:00 JST (UTC+9)
  workflow_dispatch:       # 手動実行も可能

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 日本語フォントインストール
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - name: Puppeteerインストール
        run: npm install puppeteer

      - name: スクリーンショット撮影
        run: |
          mkdir -p screenshots
          node << 'EOF'
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 900, height: 844 });
            await page.goto('https://sotetsugreenlab-sys.github.io/sumashaqi/tana.html', {
              waitUntil: 'networkidle0',
              timeout: 30000
            });
            // Supabaseデータ読み込み待ち
            await new Promise(r => setTimeout(r, 5000));

            const today = new Date().toLocaleDateString('ja-JP', {
              timeZone: 'Asia/Tokyo',
              year: 'numeric', month: '2-digit', day: '2-digit'
            }).replace(/\//g, '-');

            // 棚1スクリーンショット
            await page.screenshot({ path: 'screenshots/tana-1.png', fullPage: true });
            await page.screenshot({ path: `screenshots/${today}-tana-1.png`, fullPage: true });
            console.log('棚1 saved!');

            // 棚2ボタンをクリック
            const buttons = await page.$$('button');
            for (const btn of buttons) {
              const text = await btn.evaluate(el => el.textContent.trim());
              if (text.includes('棚2') || text.includes('2')) {
                await btn.click();
                break;
              }
            }
            await new Promise(r => setTimeout(r, 2000));

            // 棚2スクリーンショット
            await page.screenshot({ path: 'screenshots/tana-2.png', fullPage: true });
            await page.screenshot({ path: `screenshots/${today}-tana-2.png`, fullPage: true });
            console.log('棚2 saved!');

            await browser.close();
          })();
          EOF

      - name: index.json更新
        run: |
          DATE=$(TZ=Asia/Tokyo date '+%Y-%m-%d')
          INDEX_FILE="screenshots/index.json"
          if [ -f "$INDEX_FILE" ]; then
            # 既存リストに今日の日付を追加（重複除去・降順）
            node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('$INDEX_FILE', 'utf8'));
              const dates = new Set(data.dates);
              dates.add('$DATE');
              data.dates = Array.from(dates).sort().reverse();
              fs.writeFileSync('$INDEX_FILE', JSON.stringify(data, null, 2));
            "
          else
            echo '{"dates":["'$DATE'"]}' > "$INDEX_FILE"
          fi

      - name: コミット＆プッシュ
        run: |
          DATE=$(TZ=Asia/Tokyo date '+%Y-%m-%d')
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add screenshots/tana-1.png screenshots/tana-2.png \
                  screenshots/${DATE}-tana-1.png screenshots/${DATE}-tana-2.png \
                  screenshots/index.json
          git diff --staged --quiet || git commit -m "📸 棚管理 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push
