name: 棚管理スクリーンショット

on:
  schedule:
    - cron: '0 1 * * *'  # 毎日 10:00 JST (UTC+9)
  workflow_dispatch:       # 手動実行も可能

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Puppeteerインストール
        run: npm install puppeteer

      - name: スクリーンショット撮影
        run: |
          mkdir -p screenshots
          node << 'EOF'
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 390, height: 844 });
            await page.goto('https://sotetsugreenlab-sys.github.io/sumashaqi/tana.html', {
              waitUntil: 'networkidle0',
              timeout: 30000
            });
            // Supabaseデータ読み込み待ち
            await new Promise(r => setTimeout(r, 5000));
            await page.screenshot({ path: 'screenshots/tana.png', fullPage: true });
            await browser.close();
            console.log('Screenshot saved!');
          })();
          EOF

      - name: コミット＆プッシュ
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add screenshots/tana.png
          git diff --staged --quiet || git commit -m "📸 棚管理 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push
