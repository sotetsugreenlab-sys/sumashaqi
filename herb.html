function getStagesForSow(herb, sow) {
  if (herb.stagesNewFrom && herb.stages2 && toDateStr(sow) >= herb.stagesNewFrom) {
    return herb.stages2;
  }
  return herb.stages;
}

function getBagCount(herb, date) {
  if (!herb.bagBase) return null;
  const diff = Math.round((parseDate(toDateStr(date)) - parseDate(herb.bagBase.date)) / 86400000);
  return Math.max(0, herb.bagBase.count - diff);
}

function fmt(d) {
  const w = ['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${w}）`;
}
function fmtShort(d) { return `${d.getMonth()+1}/${d.getDate()}`; }
function fmtMD(d) {
  const w = ['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getMonth()+1}月${d.getDate()}日（${w}）`;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function toDateStr(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); }
function isSameDay(a, b) { return toDateStr(a) === toDateStr(b); }
function isValidSow(herb, date) {
  const ds = toDateStr(date);
  const cutoff = herb.sowCutoff ?? herb.sowDates[herb.sowDates.length - 1];
  const validDay = herb.sowDays ? herb.sowDays.includes(date.getDay()) : (date.getDay()===1||date.getDay()===5);
  return herb.sowDates.includes(ds) || (cutoff !== undefined && ds > cutoff && validDay);
}

}

let lotNotes = {};
async function loadLotNotes() {
  const cropNames = HERBS.filter(h => !h.nameOnly).map(h => h.name);
  const { data } = await db.from('lot_notes').select('id,crop,sow_date,note').in('crop', cropNames);
  lotNotes = {};
  (data || []).forEach(r => {
    const key = r.crop + ':' + r.sow_date;
    if (!lotNotes[key]) lotNotes[key] = [];
    lotNotes[key].push({ id: r.id, note: r.note });
  });
  renderTasks();
}
function openNote(id) {
  const el = document.getElementById(id);
  el.classList.add('open');
  document.getElementById(id + '-t').focus();
}
function closeNote(id) {
  document.getElementById(id).classList.remove('open');
}
async function submitNote(crop, sowDate) {
  const id = 'ni-' + crop + '-' + sowDate;
  const input = document.getElementById(id + '-t');
  const text = input.value.trim();
  if (!text) return;
  const { data } = await db.from('lot_notes').insert({ crop, sow_date: sowDate, note: text }).select('id');
  const key = crop + ':' + sowDate;
  if (!lotNotes[key]) lotNotes[key] = [];
  lotNotes[key].push({ id: data?.[0]?.id, note: text });
  input.value = '';
  closeNote(id);
  renderTasks();
}
function startEdit(noteId, sowKey) {
  const notes = lotNotes[sowKey] || [];
  const note = notes.find(n => n.id === noteId);
  if (!note) return;
  document.getElementById('ew-' + noteId).style.display = 'flex';
  const input = document.getElementById('ei-' + noteId);
  input.value = note.note;
  input.focus();
}
function cancelEdit(noteId) {
  document.getElementById('ew-' + noteId).style.display = 'none';
}
async function saveEdit(noteId, sowKey) {
  const input = document.getElementById('ei-' + noteId);
  const text = input.value.trim();
  if (!text) return;
  await db.from('lot_notes').update({ note: text }).eq('id', noteId);
  const notes = lotNotes[sowKey] || [];
  const item = notes.find(n => n.id === noteId);
  if (item) item.note = text;
  renderTasks();
}
function herbNotesHtml(herbName, sowDateStr) {
  const key = herbName + ':' + sowDateStr;
  const notes = lotNotes[key] || [];
  const id = 'ni-' + herbName + '-' + sowDateStr;
  const items = notes.map(n => `
    <div class="card-note-item">📝 ${n.note}
      <button class="btn-note-edit" onclick="startEdit(${n.id},'${key}')">編集</button>
    </div>
    <div class="note-input-wrap" id="ew-${n.id}" style="display:none">
      <input class="note-input" id="ei-${n.id}" onkeydown="if(event.key==='Enter')saveEdit(${n.id},'${key}')">
      <button class="btn-note-save" onclick="saveEdit(${n.id},'${key}')">保存</button>
      <button class="btn-note-cancel" onclick="cancelEdit(${n.id})">✕</button>
    </div>`).join('');
  return `<div class="card-notes">
    ${items}
    <div id="${id}" class="note-input-wrap">
      <input class="note-input" id="${id}-t" placeholder="メモを入力…" onkeydown="if(event.key==='Enter')submitNote('${herbName}','${sowDateStr}')">
      <button class="btn-note-save" onclick="submitNote('${herbName}','${sowDateStr}')">保存</button>
      <button class="btn-note-cancel" onclick="closeNote('${id}')">✕</button>
    </div>
    <button class="btn-note-add" onclick="openNote('${id}')">＋ メモ</button>
  </div>`;
}

db.channel('lot_notes_herb')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'lot_notes' }, payload => {
    const n = payload.new;
    const cropNames = HERBS.filter(h => !h.nameOnly).map(h => h.name);
    if (n && cropNames.includes(n.crop)) {
      const key = n.crop + ':' + n.sow_date;
      if (!lotNotes[key]) lotNotes[key] = [];
      const existing = lotNotes[key].find(r => r.id === n.id);
      if (existing) existing.note = n.note;
      else lotNotes[key].push({ id: n.id, note: n.note });
      renderTasks();
    }
  })
  .subscribe();

function makeCompactCard(stage, sow, herbName) {
  return `<div class="card ${stage.cls}">
    <div class="card-task">${stage.label}</div>
    <div class="card-sow">${fmtShort(sow)}播種</div>
    <div class="card-sub">${stage.days}日目</div>
    ${herbName ? herbNotesHtml(herbName, toDateStr(sow)) : ''}
  </div>`;
}

function makeCompactCardHarvest(stage, sow, offset) {
  const clsMap = {'-2':'card-harvest-w2','-1':'card-harvest-w1','0':'card-harvest','1':'card-harvest-ov1','2':'card-harvest-ov2'};
  const badgeMap = {'-2':'<span class="harvest-badge badge-w2">あと2日</span>','-1':'<span class="harvest-badge badge-w1">あと1日</span>','0':'','1':'<span class="harvest-badge badge-ov1">1日経過</span>','2':'<span class="harvest-badge badge-ov2">2日経過</span>'};
  const cls = clsMap[offset] ?? 'card-harvest';
  const badge = badgeMap[offset] ?? '';
  return `<div class="card ${cls}">
    <div class="card-task">${stage.label}${badge}</div>
    <div class="card-sow">${fmtShort(sow)}播種</div>
    <div class="card-sub">${stage.days + offset}日目</div>
  </div>`;
}

function renderTasks() {
  let html = '';
  const activeHerbs = HERBS.filter(h => !h.nameOnly);
  const nameOnlyHerbs = HERBS.filter(h => h.nameOnly);

  activeHerbs.forEach(herb => {
    const sowToday = isValidSow(herb, viewDate);
    const allStageSets = [herb.stages, ...(herb.stages2 ? [herb.stages2] : [])];

    // 収穫カード：旧・新どちらのharvest日数も確認
    const harvestDayValues = [...new Set(allStageSets.map(s => s[0].days))];
    const harvestCards = [];
    const harvestSeenSow = new Set();
    harvestDayValues.forEach(hDays => {
      const sow = addDays(viewDate, -hDays);
      const sowStr = toDateStr(sow);
      if (harvestSeenSow.has(sowStr) || !isValidSow(herb, sow)) return;
      const appStages = getStagesForSow(herb, sow);
      if (appStages[0].days === hDays) {
        harvestSeenSow.add(sowStr);
        harvestCards.push(makeCompactCard(appStages[0], sow, herb.name));
      }
    });
    const harvestCellHtml = harvestCards.length > 0
      ? `<div class="harvest-stack">${harvestCards.join('')}</div>`
      : `<div class="card-empty"><span class="card-empty-text">−</span></div>`;

    // その他セル：30穴グループ・非30穴グループに分け、両スケジュールをスタック表示
    const makePosCell = (is30ana) => {
      const cards = [];
      const seenSow = new Set();
      allStageSets.forEach(stageSet => {
        stageSet.slice(1).filter(s => s.label.includes('30穴') === is30ana).forEach(stage => {
          const sow = addDays(viewDate, -stage.days);
          const sowStr = toDateStr(sow);
          if (seenSow.has(sowStr) || !isValidSow(herb, sow)) return;
          const appStages = getStagesForSow(herb, sow);
          const match = appStages.slice(1).find(s => s.days === stage.days);
          if (match) { seenSow.add(sowStr); cards.push(makeCompactCard(match, sow, herb.name)); }
        });
      });
      const inner = cards.length > 0
        ? `<div class="harvest-stack">${cards.join('')}</div>`
        : `<div class="card-empty"><span class="card-empty-text">−</span></div>`;
      return `<div class="stage-cell">${inner}</div>`;
    };
    const otherCells = [makePosCell(false), makePosCell(true)];

    const hasTask = harvestCards.length > 0 ||
      allStageSets.some(stageSet =>
        stageSet.slice(1).some(s => {
          const sow = addDays(viewDate, -s.days);
          if (!isValidSow(herb, sow)) return false;
          return getStagesForSow(herb, sow).slice(1).some(as => as.days === s.days);
        })
      );
    const bagCount = getBagCount(herb, viewDate);
    const bagHtml = bagCount !== null
      ? `<span class="herb-bag${bagCount <= 3 ? ' low' : ''}">袋 <strong>${bagCount}</strong>組</span>`
      : '';
    html += `<div class="herb-section">
      <a class="herb-header" href="${herb.href}" style="color:${herb.color}">
        <span>${herb.name}${herb.seeds != null ? `<span class="herb-seeds">${herb.seeds}粒</span>` : ''}</span>
        ${bagHtml}<span class="herb-arrow">›</span>
      </a>
      ${hasTask
        ? `<div class="stage-row"><div class="stage-cell">${harvestCellHtml}</div>${otherCells.join('')}</div>`
        : (sowToday ? '' : '<div class="no-task-inline">本日の作業なし</div>')
      }
    </div>`;
  });

  // 名前のみ表示（下部まとめ）
  if (nameOnlyHerbs.length > 0) {
    html += `<div class="name-only-section">
      <div class="name-only-title">その他のハーブ</div>
      <div class="name-only-list">${nameOnlyHerbs.map(h =>
        `<a class="name-only-item" href="${h.href}" style="color:${h.color}">${h.name}</a>`
      ).join('')}</div>
    </div>`;
  }

  document.getElementById('tasks').innerHTML = html;
}

function renderSowBanner() {
  document.getElementById('sow-banner').innerHTML = '';
}

function renderAll() { renderHeader(); renderSowBanner(); renderTasks(); }

// 計算機
let calcHerbIdx = 0;

function initHerbTabs() {
  document.getElementById('herb-tabs').innerHTML = HERBS.map((h, i) =>
    `<button class="herb-tab${i===0?' active':''}" id="herb-tab-${i}"
      onclick="selectHerbCalc(${i})"
      style="${i===0?`background:${h.color};color:#fff;border-color:${h.color}`:''}">
      ${h.name}
    </button>`
  ).join('');
}

function selectHerbCalc(idx) {
  calcHerbIdx = idx;
  HERBS.forEach((h, i) => {
    const el = document.getElementById(`herb-tab-${i}`);
    if (i === idx) {
      el.classList.add('active');
      el.style.background = h.color;
      el.style.color = '#fff';
      el.style.borderColor = h.color;
    } else {
      el.classList.remove('active');
      el.style.background = '#fff';
      el.style.color = '#666';
      el.style.borderColor = '#ccc';
    }
  });
  document.getElementById('sow-result').innerHTML = '';
  document.getElementById('harvest-result').innerHTML = '';
}

function switchCalcTab(tab) {
  document.getElementById('tab-sow').classList.toggle('active', tab==='sow');
  document.getElementById('tab-harvest').classList.toggle('active', tab==='harvest');
  document.getElementById('panel-sow').style.display = tab==='sow' ? '' : 'none';
  document.getElementById('panel-harvest').style.display = tab==='harvest' ? '' : 'none';
}

function chip(label, days, date) {
  const dayStr = days === 0 ? '播種日' : `播種から${days}日目`;
  return `<div class="calc-chip"><div class="chip-label">${label} <span class="chip-day">${dayStr}</span></div><div class="chip-val">${fmtMD(date)}</div></div>`;
}

function scheduleGroup(labelText, isNew, stages, sow) {
  const chips = [chip('播種', 0, sow)]
    .concat([...stages].reverse().map(s => chip(s.label, s.days, addDays(sow, s.days))))
    .join('');
  return `<div class="calc-group">
    <div class="calc-group-label${isNew ? ' new' : ''}">${labelText}${isNew ? '<span class="calc-group-note">※2026年8月12日から</span>' : ''}</div>
    <div class="calc-result">${chips}</div>
  </div>`;
}

function calcFromSow() {
  const val = document.getElementById('sow-input').value;
  if (!val) return;
  const sow = parseDate(val);
  const herb = HERBS[calcHerbIdx];
  let html = '';
  if (herb.stages2) {
    html += scheduleGroup('従来スケジュール', false, herb.stages, sow);
    html += scheduleGroup('新スケジュール', true, herb.stages2, sow);
  } else {
    html = scheduleGroup('栽培スケジュール', false, herb.stages, sow);
  }
  document.getElementById('sow-result').innerHTML = html;
}

function calcFromHarvest() {
  const val = document.getElementById('harvest-input').value;
  if (!val) return;
  const herb = HERBS[calcHerbIdx];
  let html = '';
  if (herb.stages2) {
    const sow1 = addDays(parseDate(val), -herb.stages[0].days);
    const sow2 = addDays(parseDate(val), -herb.stages2[0].days);
    html += scheduleGroup('従来スケジュール', false, herb.stages, sow1);
    html += scheduleGroup('新スケジュール', true, herb.stages2, sow2);
  } else {
    const sow = addDays(parseDate(val), -herb.stages[0].days);
    html = scheduleGroup('栽培スケジュール', false, herb.stages, sow);
  }
  document.getElementById('harvest-result').innerHTML = html;
}

document.getElementById('sow-input').value = toDateStr(realToday);
document.getElementById('harvest-input').value = toDateStr(realToday);

initHerbTabs();
renderAll();
loadLotNotes();
</script>
