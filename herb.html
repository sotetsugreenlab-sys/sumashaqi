<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハーブ</title>
<link rel="apple-touch-icon" href="Saibai%20Cat.png">
<link rel="icon" href="Saibai%20Cat.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ハーブ">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #fff; padding: 1rem 0.5rem; }

.header { text-align: center; margin-bottom: 1rem; }
.back-link { display: inline-block; font-size: 13px; color: #534AB7; background: #EEEDFE; border-radius: 20px; padding: 4px 14px; text-decoration: none; margin-bottom: 10px; }
.nav-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
.nav-btn { font-size: 20px; color: #aaa; background: none; border: none; cursor: pointer; padding: 0 4px; line-height: 1; }
.nav-btn:active { color: #1a1a1a; }
.date-big { font-size: 22px; font-weight: 500; color: #1a1a1a; }
.date-sub { font-size: 13px; color: #666; margin-top: 2px; }
.back-today { display: inline-block; margin-top: 6px; font-size: 12px; color: #534AB7; background: #EEEDFE; border: none; border-radius: 20px; padding: 3px 12px; cursor: pointer; }

.sow-banner { background: #EAF3DE; border-radius: 12px; padding: 0.75rem 1.25rem; margin-bottom: 10px; font-size: 15px; font-weight: 500; color: #3B6D11; }

/* Herb section */
.herb-section { margin-bottom: 16px; }
.herb-header { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600; padding: 5px 2px 7px; text-decoration: none; border-bottom: 1.5px solid #f0f0ed; margin-bottom: 7px; }
.herb-arrow { font-size: 16px; color: #ccc; }
.herb-seeds { font-size: 12px; font-weight: 400; color: #999; margin-left: 6px; }
.sow-today { font-size: 12px; font-weight: 500; color: #3B6D11; background: #EAF3DE; border-radius: 6px; padding: 4px 10px; margin-bottom: 5px; display: inline-block; }
.no-task-inline { font-size: 12px; color: #ccc; padding: 4px 2px; }

/* Stage row - horizontal card layout */
.stage-row { display: flex; gap: 6px; }
.stage-cell { flex: 1; min-width: 0; }

/* Compact cards */
.card { border-radius: 10px; padding: 0.55rem 0.65rem; margin-bottom: 0; }
.card-harvest { background: #FAECE7; }
.card-green   { background: #EAF3DE; }
.card-yellow  { background: #F3F5DE; }
.card-led     { background: #E6F1FB; }
.card-30      { background: #EEEDFE; }
.card-task { font-size: 11px; font-weight: 500; margin-bottom: 2px; }
.card-harvest .card-task { color: #993C1D; }
.card-green   .card-task { color: #3B6D11; }
.card-yellow  .card-task { color: #6D8B11; }
.card-led     .card-task { color: #185FA5; }
.card-30      .card-task { color: #534AB7; }
.card-sow { font-size: 17px; font-weight: 500; color: #1a1a1a; }
.card-sub { font-size: 10px; color: #888; margin-top: 1px; }
.card-empty { border-radius: 10px; padding: 0.55rem 0.65rem; background: #fafafa; border: 1px dashed #e8e8e8; display: flex; align-items: center; justify-content: center; min-height: 56px; }
.card-empty-text { font-size: 10px; color: #ccc; }

/* Harvest window */
.card-harvest-w2  { background: #FEF6F3; }
.card-harvest-w1  { background: #FCF1EC; }
.card-harvest-ov1 { background: #F2D5C8; }
.card-harvest-ov2 { background: #E8B89A; }
.card-harvest-w2  .card-task { color: #C8A07A; }
.card-harvest-w1  .card-task { color: #B5603A; }
.card-harvest-ov1 .card-task { color: #993C1D; }
.card-harvest-ov2 .card-task { color: #7A1A00; }
.harvest-badge { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 6px; margin-left: 3px; display: inline-block; vertical-align: middle; }
.badge-w2  { background: #F5D8A0; color: #7A4F00; }
.badge-w1  { background: #E09060; color: #fff; }
.badge-ov1 { background: #D04020; color: #fff; }
.badge-ov2 { background: #902000; color: #fff; }
.harvest-stack { display: flex; flex-direction: column; gap: 4px; }

/* Calculator */
.calc-box { background: #f5f5f2; border-radius: 12px; padding: 1rem 1.25rem; margin-top: 1rem; margin-bottom: 10px; }
.calc-title { font-size: 13px; font-weight: 500; color: #666; margin-bottom: 10px; }
.herb-tabs { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 2px; }
.herb-tab { font-size: 12px; padding: 4px 12px; border: 0.5px solid #ccc; border-radius: 20px; background: #fff; color: #666; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.herb-tab.active { font-weight: 600; border-width: 1.5px; }
.calc-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.calc-tab { font-size: 13px; padding: 4px 14px; border: 0.5px solid #ccc; border-radius: 20px; background: #fff; color: #666; cursor: pointer; }
.calc-tab.active { background: #EEEDFE; border-color: #AFA9EC; color: #534AB7; font-weight: 500; }
.calc-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.calc-row label { font-size: 12px; color: #666; min-width: 48px; }
input[type=date] { font-size: 13px; padding: 5px 8px; border: 0.5px solid #ccc; border-radius: 8px; background: #fff; color: #1a1a1a; }
.btn-calc { font-size: 13px; padding: 5px 16px; border: 0.5px solid #AFA9EC; border-radius: 8px; background: #EEEDFE; color: #534AB7; cursor: pointer; font-weight: 500; }
.calc-result { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.calc-chip { background: #fff; border: 0.5px solid #ccc; border-radius: 8px; padding: 6px 12px; }
.chip-label { font-size: 11px; color: #666; margin-bottom: 2px; display: flex; align-items: center; gap: 4px; }
.chip-day { font-size: 11px; color: #aaa; }
.chip-val { font-weight: 500; font-size: 14px; color: #1a1a1a; }
</style>
</head>
<body>

<div class="header">
  <a class="back-link" href="index.html">← トップ</a>
  <div class="nav-row">
    <button class="nav-btn" onclick="navigate(-1)">＜</button>
    <div class="date-big" id="disp-date"></div>
    <button class="nav-btn" onclick="navigate(1)">＞</button>
  </div>
  <div class="date-sub">の作業内容</div>
  <div id="back-today-wrap"></div>
</div>

<div id="sow-banner"></div>
<div id="tasks"></div>

<div class="calc-box">
  <div class="calc-title">栽培日程を計算</div>
  <div class="herb-tabs" id="herb-tabs"></div>
  <div class="calc-tabs">
    <button class="calc-tab active" id="tab-sow" onclick="switchCalcTab('sow')">播種日 → 各日程</button>
    <button class="calc-tab" id="tab-harvest" onclick="switchCalcTab('harvest')">刈取日 → 播種日</button>
  </div>
  <div id="panel-sow">
    <div class="calc-row">
      <label>播種日</label>
      <input type="date" id="sow-input" />
      <button class="btn-calc" onclick="calcFromSow()">計算</button>
    </div>
    <div class="calc-result" id="sow-result"></div>
  </div>
  <div id="panel-harvest" style="display:none;">
    <div class="calc-row">
      <label>刈取日</label>
      <input type="date" id="harvest-input" />
      <button class="btn-calc" onclick="calcFromHarvest()">計算</button>
    </div>
    <div class="calc-result" id="harvest-result"></div>
  </div>
</div>

<script>
const HERBS = [
  {
    name: 'バジル', href: 'basil.html', color: '#3B6D11', seeds: 10,
    sowDays: [1,2,3,4,0], sowCutoff: '2026-06-01', // 6/2〜 月火水木日
    sowDates: ['2026-04-08','2026-04-14','2026-04-23','2026-05-02','2026-05-15','2026-05-18','2026-05-22','2026-05-25','2026-05-29','2026-06-01'],
    stages: [
      { label: '収穫',       days: 35, cls: 'card-harvest' },
      { label: '6穴へ移植',  days: 17, cls: 'card-green'   },
      { label: '30穴へ移植', days: 9,  cls: 'card-30'      },
    ]
  },
  {
    name: 'ルッコラ', href: 'rucola.html', color: '#6D8B11', seeds: 8,
    sowDays: [1,2,3,4,0], sowCutoff: '2099-12-31', // 本栽培では定期播種なし
    sowDates: ['2026-04-14','2026-04-23','2026-05-02','2026-05-15','2026-05-18','2026-05-21','2026-05-22','2026-05-25','2026-05-29'],
    stages: [
      { label: '収穫',       days: 30, cls: 'card-harvest' },
      { label: '8穴へ移植',  days: 17, cls: 'card-yellow'  },
      { label: '30穴へ移植', days: 9,  cls: 'card-30'      },
    ]
  },
  {
    name: 'ワイルドロケット', href: 'rocket.html', color: '#8B6D11', seeds: 8,
    sowDays: [1,2,3,4,0], sowCutoff: '2026-06-01', // 6/2〜 月火水木日
    sowDates: ['2026-05-21','2026-05-22','2026-05-25','2026-05-29','2026-06-01'],
    stages: [
      { label: '収穫',       days: 34, cls: 'card-harvest' },
      { label: '6穴へ移植',  days: 20, cls: 'card-green'   },
      { label: '30穴へ移植', days: 9,  cls: 'card-30'      },
    ]
  },
  {
    name: 'パクチー', href: 'pakuchi.html', color: '#11836D', seeds: 5,
    sowDays: [1,2,3,4,0], sowCutoff: '2026-06-01', // 6/2〜 月火水木日（週5回・15キューブ/回）
    sowDates: ['2026-04-23','2026-05-02','2026-05-22','2026-05-24','2026-05-25','2026-05-26','2026-05-27','2026-05-29','2026-06-01'],
    stages: [
      { label: '収穫',             days: 33, cls: 'card-harvest' },
      { label: 'LED高い場所へ移動', days: 21, cls: 'card-led'    },
      { label: '30穴へ移植',       days: 10, cls: 'card-30'      },
    ]
  },
  {
    name: 'イタリアンパセリ', href: 'parsley.html', color: '#7B4FA8', seeds: 5,
    sowDays: [5], sowCutoff: '2026-06-01', // 6/5〜 毎週金曜（サンプル・30キューブ/回）
    sowDates: ['2026-05-13','2026-05-21','2026-05-24','2026-05-27','2026-05-31'],
    stages: [
      { label: '収穫',          days: 35, cls: 'card-harvest' },
      { label: 'LED高い段へ移動', days: 26, cls: 'card-led'    },
      { label: '30穴へ移植',    days: 12, cls: 'card-30'      },
    ]
  },
  {
    name: 'ディル', href: 'dill.html', color: '#B5860D', seeds: 3,
    sowDays: [5], sowCutoff: '2026-06-01', // 6/5〜 毎週金曜（サンプル・30キューブ/回）
    sowDates: ['2026-05-13','2026-05-21','2026-05-24','2026-05-27','2026-05-31'],
    stages: [
      { label: '収穫',          days: 33, cls: 'card-harvest' },
      { label: 'LED高い段へ移動', days: 26, cls: 'card-led'    },
      { label: '30穴へ移植',    days: 9,  cls: 'card-30'      },
    ]
  },
];

function fmt(d) {
  const w = ['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${w}）`;
}
function fmtShort(d) { return `${d.getMonth()+1}/${d.getDate()}`; }
function fmtMD(d) {
  const w = ['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getMonth()+1}月${d.getDate()}日（${w}）`;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function toDateStr(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); }
function isSameDay(a, b) { return toDateStr(a) === toDateStr(b); }
function isValidSow(herb, date) {
  const ds = toDateStr(date);
  const cutoff = herb.sowCutoff ?? herb.sowDates[herb.sowDates.length - 1];
  const validDay = herb.sowDays ? herb.sowDays.includes(date.getDay()) : (date.getDay()===1||date.getDay()===5);
  return herb.sowDates.includes(ds) || (cutoff !== undefined && ds > cutoff && validDay);
}

const realToday = new Date();
let viewDate = new Date(realToday);

function navigate(delta) { viewDate = addDays(viewDate, delta); renderAll(); }
function goToday() { viewDate = new Date(realToday); renderAll(); }

function renderHeader() {
  document.getElementById('disp-date').textContent = fmt(viewDate);
  document.getElementById('back-today-wrap').innerHTML = isSameDay(viewDate, realToday)
    ? '' : `<button class="back-today" onclick="goToday()">今日に戻る</button>`;
}

function makeCompactCard(stage, sow) {
  return `<div class="card ${stage.cls}">
    <div class="card-task">${stage.label}</div>
    <div class="card-sow">${fmtShort(sow)}播種</div>
    <div class="card-sub">${stage.days}日目</div>
  </div>`;
}

function makeCompactCardHarvest(stage, sow, offset) {
  const clsMap = {'-2':'card-harvest-w2','-1':'card-harvest-w1','0':'card-harvest','1':'card-harvest-ov1','2':'card-harvest-ov2'};
  const badgeMap = {'-2':'<span class="harvest-badge badge-w2">あと2日</span>','-1':'<span class="harvest-badge badge-w1">あと1日</span>','0':'','1':'<span class="harvest-badge badge-ov1">1日経過</span>','2':'<span class="harvest-badge badge-ov2">2日経過</span>'};
  const cls = clsMap[offset] ?? 'card-harvest';
  const badge = badgeMap[offset] ?? '';
  return `<div class="card ${cls}">
    <div class="card-task">${stage.label}${badge}</div>
    <div class="card-sow">${fmtShort(sow)}播種</div>
    <div class="card-sub">${stage.days + offset}日目</div>
  </div>`;
}

function renderTasks() {
  let html = '';
  HERBS.forEach(herb => {
    const sowToday = isValidSow(herb, viewDate);
    const harvestStage = herb.stages[0]; // 刈取（最長日数）

    // 刈取ウィンドウ ±2日
    const harvestCards = [];
    for (let offset = -2; offset <= 2; offset++) {
      const sow = addDays(viewDate, -(harvestStage.days + offset));
      if (isValidSow(herb, sow)) harvestCards.push(makeCompactCardHarvest(harvestStage, sow, offset));
    }
    const harvestCellHtml = harvestCards.length > 0
      ? `<div class="harvest-stack">${harvestCards.join('')}</div>`
      : `<div class="card-empty"><span class="card-empty-text">−</span></div>`;

    // 移植・LED移動ステージ（当日のみ）
    const otherCells = herb.stages.slice(1).map(stage => {
      const sow = addDays(viewDate, -stage.days);
      return `<div class="stage-cell">${isValidSow(herb, sow)
        ? makeCompactCard(stage, sow)
        : '<div class="card-empty"><span class="card-empty-text">−</span></div>'}</div>`;
    });

    const hasTask = harvestCards.length > 0 ||
      herb.stages.slice(1).some(s => isValidSow(herb, addDays(viewDate, -s.days)));
    const sowBadge = sowToday ? '<div class="sow-today">🌱 今日播種</div>' : '';

    html += `<div class="herb-section">
      <a class="herb-header" href="${herb.href}" style="color:${herb.color}">
        <span>${herb.name}${herb.seeds != null ? `<span class="herb-seeds">${herb.seeds}粒</span>` : ''}</span>
        <span class="herb-arrow">›</span>
      </a>
      ${sowBadge}
      ${hasTask
        ? `<div class="stage-row"><div class="stage-cell">${harvestCellHtml}</div>${otherCells.join('')}</div>`
        : (sowToday ? '' : '<div class="no-task-inline">本日の作業なし</div>')
      }
    </div>`;
  });
  document.getElementById('tasks').innerHTML = html;
}

function renderSowBanner() {
  const anySow = HERBS.some(h => isValidSow(h, viewDate));
  document.getElementById('sow-banner').innerHTML = anySow
    ? '<div class="sow-banner">🌱 今日は播種日</div>' : '';
}

function renderAll() { renderHeader(); renderSowBanner(); renderTasks(); }

// 計算機
let calcHerbIdx = 0;

function initHerbTabs() {
  document.getElementById('herb-tabs').innerHTML = HERBS.map((h, i) =>
    `<button class="herb-tab${i===0?' active':''}" id="herb-tab-${i}"
      onclick="selectHerbCalc(${i})"
      style="${i===0?`background:${h.color};color:#fff;border-color:${h.color}`:''}">
      ${h.name}
    </button>`
  ).join('');
}

function selectHerbCalc(idx) {
  calcHerbIdx = idx;
  HERBS.forEach((h, i) => {
    const el = document.getElementById(`herb-tab-${i}`);
    if (i === idx) {
      el.classList.add('active');
      el.style.background = h.color;
      el.style.color = '#fff';
      el.style.borderColor = h.color;
    } else {
      el.classList.remove('active');
      el.style.background = '#fff';
      el.style.color = '#666';
      el.style.borderColor = '#ccc';
    }
  });
  document.getElementById('sow-result').innerHTML = '';
  document.getElementById('harvest-result').innerHTML = '';
}

function switchCalcTab(tab) {
  document.getElementById('tab-sow').classList.toggle('active', tab==='sow');
  document.getElementById('tab-harvest').classList.toggle('active', tab==='harvest');
  document.getElementById('panel-sow').style.display = tab==='sow' ? '' : 'none';
  document.getElementById('panel-harvest').style.display = tab==='harvest' ? '' : 'none';
}

function chip(label, days, date) {
  const dayStr = days === 0 ? '播種日' : `播種から${days}日目`;
  return `<div class="calc-chip"><div class="chip-label">${label} <span class="chip-day">${dayStr}</span></div><div class="chip-val">${fmtMD(date)}</div></div>`;
}

function calcFromSow() {
  const val = document.getElementById('sow-input').value;
  if (!val) return;
  const sow = parseDate(val);
  const herb = HERBS[calcHerbIdx];
  const stages = [...herb.stages].reverse();
  document.getElementById('sow-result').innerHTML =
    [chip('播種', 0, sow)].concat(stages.map(s => chip(s.label, s.days, addDays(sow, s.days)))).join('');
}

function calcFromHarvest() {
  const val = document.getElementById('harvest-input').value;
  if (!val) return;
  const herb = HERBS[calcHerbIdx];
  const harvestDays = herb.stages[0].days;
  const sow = addDays(parseDate(val), -harvestDays);
  const stages = [...herb.stages].reverse();
  document.getElementById('harvest-result').innerHTML =
    [chip('播種', 0, sow)].concat(stages.map(s => chip(s.label, s.days, addDays(sow, s.days)))).join('');
}

document.getElementById('sow-input').value = toDateStr(realToday);
document.getElementById('harvest-input').value = toDateStr(realToday);

initHerbTabs();
renderAll();
</script>
</body>
</html>
