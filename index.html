<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGL スタッフアプリ</title>
<link rel="apple-touch-icon" href="Saibai%20Cat.png">
<link rel="icon" href="Saibai%20Cat.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SGL">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #f7f7f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem; }

.logo { font-size: 13px; color: #aaa; margin-bottom: 6px; letter-spacing: 0.05em; }
.title { font-size: 24px; font-weight: 600; color: #1a1a1a; margin-bottom: 2rem; }

.menu { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 360px; }

/* 2-column grid row */
.menu-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Square card */
.menu-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  background: #fff;
  border-radius: 16px;
  padding: 1.4rem 0.75rem;
  box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  transition: box-shadow 0.15s, transform 0.1s;
  aspect-ratio: 1 / 1;
  text-align: center;
  gap: 0.5rem;
}
.menu-card:active { transform: scale(0.97); box-shadow: 0 0px 2px rgba(0,0,0,0.07); }

/* Wide card (タイムアタック) */
.menu-card.wide {
  flex-direction: row;
  justify-content: flex-start;
  aspect-ratio: unset;
  padding: 1.2rem 1.4rem;
  gap: 1rem;
  text-align: left;
}

.menu-icon { font-size: 36px; }
.menu-card.wide .menu-icon { font-size: 32px; flex-shrink: 0; }

.menu-text {}
.menu-name { font-size: 16px; font-weight: 700; color: #1a1a1a; }
.menu-card.wide .menu-name { font-size: 18px; }
.menu-desc { font-size: 11px; color: #999; margin-top: 3px; }

.card-sumashaqi  { border-top: 4px solid #534AB7; }
.card-herb       { border-top: 4px solid #3B6D11; }
.card-timeattack { border-top: 4px solid #E8401C; }
.card-handover   { border-top: 4px solid #0891B2; }
.card-inventory  { border-top: 4px solid #185FA5; }
.card-shift      { border-top: 4px solid #E8A020; }
.card-tana       { border-top: 4px solid #6B7280; }
.card-harvest    { border-top: 4px solid #3D7A50; }
.card-orders     { border-top: 4px solid #534AB7; }
.card-chat       { border-top: 4px solid #10A37F; }
.card-manual     { border-top: 4px solid #3D7A50; }
.card-prints     { border-top: 4px solid #6B3FA0; }

/* バッジ */
.menu-card { position: relative; }
.badge {
  display: none;
  position: absolute; top: 10px; right: 10px;
  background: #DC2626; color: #fff;
  font-size: 10px; font-weight: 700;
  min-width: 18px; height: 18px; border-radius: 9px;
  padding: 0 5px; align-items: center; justify-content: center;
}
.badge.show { display: flex; }
</style>
</head>
<body>

<div class="logo">SGL スタッフ</div>
<div class="title">何を確認する？</div>

<div class="menu">
  <div class="menu-row">
    <a class="menu-card card-sumashaqi" href="sumashaqi_daily_schedule_v3.html">
      <div class="menu-icon">🌱</div>
      <div class="menu-text">
        <div class="menu-name">スマシャキ</div>
      </div>
    </a>
    <a class="menu-card card-herb" href="herb.html">
      <div class="menu-icon">🌿</div>
      <div class="menu-text">
        <div class="menu-name">ハーブ</div>
      </div>
    </a>
  </div>

  <div class="menu-row">
    <a class="menu-card card-shift" href="shift.html">
      <div class="menu-icon">📅</div>
      <div class="menu-text">
        <div class="menu-name">シフト</div>
      </div>
    </a>
    <a class="menu-card card-handover" href="handover.html" id="card-handover">
      <div class="badge" id="handover-badge">NEW</div>
      <div class="menu-icon">📋</div>
      <div class="menu-text">
        <div class="menu-name">引き継ぎ</div>
      </div>
    </a>
  </div>

  <div class="menu-row">
    <a class="menu-card card-tana" href="tana.html">
      <div class="menu-icon">🪜</div>
      <div class="menu-text">
        <div class="menu-name">棚管理</div>
      </div>
    </a>
    <a class="menu-card card-harvest" href="harvest_info.html">
      <div class="menu-icon">🔢</div>
      <div class="menu-text">
        <div class="menu-name">フリル実績</div>
      </div>
    </a>
  </div>

  <div class="menu-row">
    <a class="menu-card card-orders" href="orders.html">
      <div class="menu-icon">🏨</div>
      <div class="menu-text">
        <div class="menu-name">シェラトン注文</div>
      </div>
    </a>
    <a class="menu-card card-manual" href="manual.html">
      <div class="badge" id="manual-badge">NEW</div>
      <div class="menu-icon">📖</div>
      <div class="menu-text">
        <div class="menu-name">マニュアル</div>
      </div>
    </a>
    <a class="menu-card card-prints" href="prints.html">
      <div class="menu-icon">🖨️</div>
      <div class="menu-text">
        <div class="menu-name">印刷物</div>
      </div>
    </a>
    <!-- AI chat: hidden until ready
    <a class="menu-card card-chat" href="chat.html">
      <div class="menu-icon">🤖</div>
      <div class="menu-text">
        <div class="menu-name">AIチャット</div>
      </div>
    </a>
    -->
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(async () => {
  try {
    const db = supabase.createClient(
      'https://pqoexlikdviqqgdnzuud.supabase.co',
      'sb_publishable_9KR8h4be2Q5-4ux6g55hSg_Jkv9UYBM'
    );
    const { data } = await db.from('handover')
      .select('created_at')
      .order('created_at', { ascending: false })
      .limit(1);
    if (!data || data.length === 0) return;

    const latestMs = new Date(data[0].created_at).getTime();
    const lastVisitMs = new Date(localStorage.getItem('handover_last_visit') || 0).getTime();
    if (latestMs > lastVisitMs) {
      document.getElementById('handover-badge').classList.add('show');
    }
  } catch(e) {}
})();

// マニュアルバッジ
try {
  const MANUAL_UPDATED = {
    app:        '2026-10-10T00:00:00Z',
    herb:       '2026-10-08T12:00:00Z',
    sumashaqi:  '2026-10-08T12:00:00Z',
    sheraton:   '2026-01-01T00:00:00Z',
  };
  const hasNew = Object.entries(MANUAL_UPDATED).some(([key, updatedAt]) => {
    const lastVisit = localStorage.getItem('manual_visit_' + key) || '0';
    return new Date(updatedAt) > new Date(lastVisit);
  });
  if (hasNew) document.getElementById('manual-badge').classList.add('show');
} catch(e) {}
</script>
</body>
</html>
