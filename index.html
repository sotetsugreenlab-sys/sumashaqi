<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGL スタッフアプリ</title>
<link rel="apple-touch-icon" href="Saibai%20Cat.png">
<link rel="icon" href="Saibai%20Cat.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SGL">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #f7f7f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem; }

.logo { font-size: 13px; color: #aaa; margin-bottom: 6px; letter-spacing: 0.05em; }
.title { font-size: 24px; font-weight: 600; color: #1a1a1a; margin-bottom: 2rem; }

.menu { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 360px; }

/* 2-column grid row */
.menu-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Square card */
.menu-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  background: #fff;
  border-radius: 16px;
  padding: 1.4rem 0.75rem;
  box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  transition: box-shadow 0.15s, transform 0.1s;
  aspect-ratio: 1 / 1;
  text-align: center;
  gap: 0.5rem;
}
.menu-card:active { transform: scale(0.97); box-shadow: 0 0px 2px rgba(0,0,0,0.07); }

/* Wide card (タイムアタック) */
.menu-card.wide {
  flex-direction: row;
  justify-content: flex-start;
  aspect-ratio: unset;
  padding: 1.2rem 1.4rem;
  gap: 1rem;
  text-align: left;
}

.menu-icon { font-size: 36px; }
.menu-card.wide .menu-icon { font-size: 32px; flex-shrink: 0; }

.menu-text {}
.menu-name { font-size: 16px; font-weight: 700; color: #1a1a1a; }
.menu-card.wide .menu-name { font-size: 18px; }
.menu-desc { font-size: 11px; color: #999; margin-top: 3px; }

.card-sumashaqi  { border-top: 4px solid #534AB7; }
.card-herb       { border-top: 4px solid #3B6D11; }
.card-timeattack { border-left: 4px solid #E8401C; border-top: none; }
.card-inventory  { border-top: 4px solid #185FA5; }
.card-shift      { border-top: 4px solid #E8A020; }
</style>
</head>
<body>

<div class="logo">SGL スタッフ</div>
<div class="title">何を確認する？</div>

<div class="menu">
  <div class="menu-row">
    <a class="menu-card card-sumashaqi" href="sumashaqi_daily_schedule_v3.html">
      <div class="menu-icon">🌱</div>
      <div class="menu-text">
        <div class="menu-name">スマシャキ</div>
      </div>
    </a>
    <a class="menu-card card-herb" href="herb.html">
      <div class="menu-icon">🌿</div>
      <div class="menu-text">
        <div class="menu-name">ハーブ</div>
      </div>
    </a>
  </div>

  <div class="menu-row">
    <a class="menu-card card-shift" href="shift.html">
      <div class="menu-icon">📅</div>
      <div class="menu-text">
        <div class="menu-name">シフト</div>
      </div>
    </a>
    <a class="menu-card card-inventory" href="inventory.html">
      <div class="menu-icon">📦</div>
      <div class="menu-text">
        <div class="menu-name">在庫</div>
      </div>
    </a>
  </div>

  <a class="menu-card wide card-timeattack" href="timeattack.html">
    <div class="menu-icon">⏱</div>
    <div class="menu-text">
      <div class="menu-name">タイムアタック</div>
    </div>
  </a>
</div>

</body>
</html>
