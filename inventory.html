<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在庫管理</title>
<link rel="apple-touch-icon" href="Saibai%20Cat.png">
<link rel="icon" href="Saibai%20Cat.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="在庫管理">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #f7f7f5; padding: 1rem 0.75rem 3rem; }

.header { text-align: center; margin-bottom: 1.25rem; }
.back-link { display: inline-block; font-size: 13px; color: #534AB7; background: #EEEDFE; border-radius: 20px; padding: 4px 14px; text-decoration: none; margin-bottom: 10px; }
.page-title { font-size: 20px; font-weight: 600; color: #1a1a1a; }
.page-note { font-size: 12px; color: #aaa; margin-top: 5px; }

.section { margin-bottom: 20px; }
.section-title { font-size: 11px; font-weight: 700; color: #aaa; letter-spacing: 0.08em; margin-bottom: 6px; padding: 0 2px; }

/* Table header */
.inv-head {
  display: grid;
  grid-template-columns: 1fr 44px 36px 72px 52px;
  gap: 4px;
  padding: 0 10px 4px;
  font-size: 10px; color: #aaa; font-weight: 600; letter-spacing: 0.04em;
}

/* Item card */
.inv-row-wrap {
  background: #fff;
  border-radius: 12px;
  margin-bottom: 6px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  overflow: hidden;
}
.inv-row {
  display: grid;
  grid-template-columns: 1fr 44px 36px 72px 52px;
  gap: 4px;
  align-items: center;
  padding: 10px 10px;
}
.inv-name { font-size: 14px; font-weight: 600; color: #1a1a1a; }
.inv-count { font-size: 20px; font-weight: 700; color: #185FA5; text-align: center; }
.inv-count.zero { color: #ccc; }

.btn-minus {
  width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer;
  background: #f0f0ee; color: #666; font-size: 18px; font-weight: 300;
  display: flex; align-items: center; justify-content: center;
}
.btn-minus:disabled { opacity: 0.25; cursor: default; }
.btn-minus:active { background: #e0e0de; }

.btn-order {
  font-size: 11px; padding: 5px 4px; border-radius: 8px; border: 1px solid #ddd;
  background: #fafafa; color: #555; cursor: pointer; text-align: center; width: 100%;
  font-weight: 500; line-height: 1.3;
}
.btn-order.ordered { background: #FFF3CD; border-color: #E8C840; color: #7A5500; }
.btn-order:active { opacity: 0.7; }

.btn-delivery {
  font-size: 11px; padding: 5px 4px; border-radius: 8px; border: none;
  background: #185FA5; color: #fff; cursor: pointer; text-align: center; width: 100%;
  font-weight: 600;
}
.btn-delivery:active { opacity: 0.75; }

/* Delivery expand */
.delivery-expand {
  display: none;
  padding: 0 10px 10px;
  border-top: 1px solid #f0f0ed;
  padding-top: 8px;
}
.delivery-expand.open { display: flex; align-items: center; gap: 8px; }
.delivery-input {
  width: 64px; font-size: 15px; padding: 6px 8px;
  border: 1.5px solid #185FA5; border-radius: 8px; text-align: center;
  background: #fff; color: #1a1a1a; outline: none;
}
.delivery-unit { font-size: 13px; color: #666; }
.btn-delivery-confirm {
  flex: 1; font-size: 13px; font-weight: 700; padding: 8px 12px;
  background: #185FA5; color: #fff; border: none; border-radius: 8px; cursor: pointer;
}
.btn-delivery-confirm:active { opacity: 0.75; }
.btn-delivery-cancel {
  font-size: 12px; color: #aaa; background: none; border: none; cursor: pointer; padding: 4px 6px;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<div class="header">
  <a class="back-link" href="index.html">← トップ</a>
  <div class="page-title">📦 在庫管理</div>
  <div class="page-note">※ 封を開けていないもの</div>
</div>

<div id="content"></div>

<script>
const db = supabase.createClient(
  'https://pqoexlikdviqqgdnzuud.supabase.co',
  'sb_publishable_9KR8h4be2Q5-4ux6g55hSg_Jkv9UYBM'
);

const SECTIONS = [
  { title: '種',       items: ['スマシャキ', 'バジル', 'ワイルド', 'パクチー'] },
  { title: 'SGL内備品', items: ['みどりテープ', 'きいろテープ', 'ぴんくテープ', 'あおテープ', 'しろテープ'] },
];

let counts = {};
let orderDates = {};

function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDate(ds) {
  const d = new Date(ds + 'T00:00:00');
  return `${d.getMonth()+1}/${d.getDate()}`;
}

async function loadInventory() {
  const { data, error } = await db.from('inventory').select('item, count, order_date');
  if (error) { console.error(error); return; }
  (data || []).forEach(r => {
    counts[r.item] = r.count;
    orderDates[r.item] = r.order_date || null;
  });
  render();
}

function render() {
  let html = '';
  SECTIONS.forEach(sec => {
    html += `<div class="section">
      <div class="section-title">【${sec.title}】</div>
      <div class="inv-head"><span>品名</span><span style="text-align:center">現在の数</span><span></span><span style="text-align:center">発注日付</span><span style="text-align:center">納品</span></div>`;
    sec.items.forEach(item => {
      const c = counts[item] ?? 0;
      const od = orderDates[item];
      const orderLabel = od ? fmtDate(od) : '発注';
      const orderCls = od ? 'ordered' : '';
      html += `<div class="inv-row-wrap" id="wrap-${CSS.escape(item)}">
        <div class="inv-row">
          <div class="inv-name">${item}</div>
          <div class="inv-count${c===0?' zero':''}">${c}</div>
          <button class="btn-minus" onclick="adjust('${item}',-1)" ${c<=0?'disabled':''}>−</button>
          <button class="btn-order ${orderCls}" onclick="toggleOrder('${item}')">${orderLabel}</button>
          <button class="btn-delivery" onclick="openDelivery('${item}')">納品</button>
        </div>
        <div class="delivery-expand" id="expand-${CSS.escape(item)}">
          <input class="delivery-input" type="number" id="dinput-${CSS.escape(item)}" placeholder="0" min="1" step="1">
          <span class="delivery-unit">個</span>
          <button class="btn-delivery-confirm" onclick="confirmDelivery('${item}')">＋ 追加</button>
          <button class="btn-delivery-cancel" onclick="closeDelivery('${item}')">✕</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById('content').innerHTML = html;
}

function openDelivery(item) {
  const el = document.getElementById(`expand-${CSS.escape(item)}`);
  el.classList.add('open');
  const input = document.getElementById(`dinput-${CSS.escape(item)}`);
  input.value = '';
  input.focus();
}

function closeDelivery(item) {
  document.getElementById(`expand-${CSS.escape(item)}`).classList.remove('open');
}

async function confirmDelivery(item) {
  const val = parseInt(document.getElementById(`dinput-${CSS.escape(item)}`).value);
  if (!val || val <= 0) return;
  const newCount = (counts[item] ?? 0) + val;
  counts[item] = newCount;
  orderDates[item] = null;
  closeDelivery(item);
  render();
  await db.from('inventory').upsert({ item, count: newCount, order_date: null });
}

async function adjust(item, delta) {
  const newCount = Math.max(0, (counts[item] ?? 0) + delta);
  counts[item] = newCount;
  render();
  await db.from('inventory').upsert({ item, count: newCount, order_date: orderDates[item] ?? null });
}

async function toggleOrder(item) {
  if (orderDates[item]) {
    orderDates[item] = null;
  } else {
    orderDates[item] = toDateStr(new Date());
  }
  render();
  await db.from('inventory').upsert({ item, count: counts[item] ?? 0, order_date: orderDates[item] });
}

// リアルタイム同期
db.channel('inventory_changes')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory' }, payload => {
    if (payload.new) {
      counts[payload.new.item] = payload.new.count;
      orderDates[payload.new.item] = payload.new.order_date || null;
    }
    render();
  })
  .subscribe();

loadInventory();
</script>
</body>
</html>
