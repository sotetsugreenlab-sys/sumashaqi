<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業務マニュアル</title>
<link rel="apple-touch-icon" href="Saibai%20Cat.png">
<link rel="icon" href="Saibai%20Cat.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SGL">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #f7f7f5; min-height: 100vh; padding: 1rem; }

.header {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.75rem 0 1rem;
  border-bottom: 1px solid #e5e5e3;
  margin-bottom: 1.5rem;
}
.back-btn { text-decoration: none; color: #534AB7; font-size: 14px; font-weight: 600; }
.header-title { font-size: 18px; font-weight: 700; color: #1a1a1a; }

.section-title {
  font-size: 12px; font-weight: 700; color: #aaa;
  letter-spacing: 0.08em; text-transform: uppercase;
  margin-bottom: 0.75rem; padding-left: 2px;
}

.manual-list {
  display: flex; flex-direction: column; gap: 10px;
  margin-bottom: 2rem;
}

.manual-item {
  display: flex; align-items: center; gap: 1rem;
  background: #fff; border-radius: 14px;
  padding: 1rem 1.2rem;
  box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  text-decoration: none; color: #1a1a1a;
  border-left: 4px solid #3D7A50;
  transition: box-shadow 0.15s, transform 0.1s;
}
.manual-item:active { transform: scale(0.98); box-shadow: 0 0 2px rgba(0,0,0,0.07); }

.manual-icon { font-size: 28px; flex-shrink: 0; }
.manual-info { flex: 1; min-width: 0; }
.manual-name { font-size: 16px; font-weight: 700; color: #1a1a1a; }
.manual-desc { font-size: 12px; color: #999; margin-top: 2px; }
.manual-arrow { font-size: 18px; color: #ccc; flex-shrink: 0; }
.manual-item { position: relative; }
.manual-badge {
  display: none; position: absolute; top: 10px; right: 36px;
  background: #DC2626; color: #fff;
  font-size: 10px; font-weight: 700;
  padding: 1px 7px; border-radius: 8px;
}
.manual-badge.show { display: block; }

/* パスワードゲート */
.pw-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: #f7f7f5;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.pw-card {
  background: #fff; border-radius: 20px;
  padding: 32px 28px; width: 100%; max-width: 320px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.12);
  text-align: center;
}
.pw-icon { font-size: 40px; margin-bottom: 12px; }
.pw-title { font-size: 18px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; }
.pw-sub { font-size: 13px; color: #999; margin-bottom: 20px; }
.pw-input {
  width: 100%; padding: 12px 14px; font-size: 18px;
  border: 2px solid #e5e5e3; border-radius: 12px;
  text-align: center; letter-spacing: 0.15em;
  outline: none; margin-bottom: 12px;
}
.pw-input:focus { border-color: #3D7A50; }
.pw-btn {
  width: 100%; padding: 13px; font-size: 15px; font-weight: 700;
  background: #3D7A50; color: #fff; border: none; border-radius: 12px; cursor: pointer;
}
.pw-error { font-size: 13px; color: #DC2626; margin-top: 8px; display: none; }
</style>
</head>
<body>

<!-- パスワードゲート -->
<div class="pw-overlay" id="pw-overlay">
  <div class="pw-card">
    <div class="pw-icon">🔒</div>
    <div class="pw-title">業務マニュアル</div>
    <div class="pw-sub">パスワードを入力してください</div>
    <input class="pw-input" id="pw-input" type="text" maxlength="20" placeholder="パスワード" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    <button class="pw-btn" id="pw-btn">開く</button>
    <div class="pw-error" id="pw-error">パスワードが違います</div>
  </div>
</div>

<div id="main-content" hidden>
<div class="header">
  <a class="back-btn" href="index.html">← 戻る</a>
  <div class="header-title">📖 業務マニュアル</div>
</div>

<div class="manual-list">
  <a class="manual-item" href="app-manual.html" style="border-left-color:#534AB7">
    <div class="manual-badge" id="badge-app">NEW</div>
    <div class="manual-icon">📱</div>
    <div class="manual-info">
      <div class="manual-name">アプリの使い方</div>
      <div class="manual-desc">各機能の操作ガイド</div>
    </div>
    <div class="manual-arrow">›</div>
  </a>
  <a class="manual-item" href="herb-manual.html" style="border-left-color:#8B6D11">
    <div class="manual-badge" id="badge-herb">NEW</div>
    <div class="manual-icon">🌿</div>
    <div class="manual-info">
      <div class="manual-name">ハーブ（バジル・ワイルドルッコラ）</div>
      <div class="manual-desc">栽培・出荷マニュアル</div>
    </div>
    <div class="manual-arrow">›</div>
  </a>
  <a class="manual-item" href="sumashaqi-manual.html">
    <div class="manual-badge" id="badge-sumashaqi">NEW</div>
    <div class="manual-icon">🥬</div>
    <div class="manual-info">
      <div class="manual-name">スマシャキ（フリルレタス）</div>
      <div class="manual-desc">収穫・出荷マニュアル</div>
    </div>
    <div class="manual-arrow">›</div>
  </a>
  <a class="manual-item" href="input-manual.html" style="border-left-color:#3D7A50">
    <div class="manual-badge" id="badge-input">NEW</div>
    <div class="manual-icon">✏️</div>
    <div class="manual-info">
      <div class="manual-name">報告入力 使い方</div>
      <div class="manual-desc">液肥・スマシャキ・ハーブの入力ガイド</div>
    </div>
    <div class="manual-arrow">›</div>
  </a>
  <a class="manual-item" href="sheraton-manual.html" style="border-left-color:#8B6D11">
    <div class="manual-badge" id="badge-sheraton">NEW</div>
    <div class="manual-icon">🏨</div>
    <div class="manual-info">
      <div class="manual-name">シェラトン伝票印刷</div>
      <div class="manual-desc">注文確認・納品数入力・伝票印刷の手順</div>
    </div>
    <div class="manual-arrow">›</div>
  </a>
</div>
</div><!-- /main-content -->

<script>
// パスワードゲート
const MANUAL_PW = '510ab';
const PW_KEY = 'manual_unlocked';
function unlock() {
  document.getElementById('pw-overlay').hidden = true;
  document.getElementById('main-content').hidden = false;
  try { localStorage.setItem(PW_KEY, '1'); } catch(e) {}
}
try {
  if (localStorage.getItem(PW_KEY) === '1') { unlock(); }
} catch(e) {}
document.getElementById('pw-btn').addEventListener('click', () => {
  if (document.getElementById('pw-input').value === MANUAL_PW) {
    unlock();
  } else {
    document.getElementById('pw-error').style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
});
document.getElementById('pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('pw-btn').click();
});

// 各マニュアルの最終更新日時（更新のたびにここを変える）
const MANUAL_UPDATED = {
  app:        '2026-10-10T00:00:00Z',
  herb:       '2026-11-14T00:00:00Z',
  sumashaqi:  '2026-11-14T00:00:00Z',
  input:      '2026-11-14T00:00:00Z',
  sheraton:   '2026-01-01T00:00:00Z',
};
try {
  Object.entries(MANUAL_UPDATED).forEach(([key, updatedAt]) => {
    const lastVisit = localStorage.getItem('manual_visit_' + key) || '0';
    if (new Date(updatedAt) > new Date(lastVisit)) {
      document.getElementById('badge-' + key)?.classList.add('show');
    }
  });
} catch(e) {}
</script>

</body>
</html>
