<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注文一覧</title>
<link rel="apple-touch-icon" href="Saibai%20Cat.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SGL">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #f7f7f5; min-height: 100vh; padding: 1rem; }

.header {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.75rem 0 1rem;
  border-bottom: 1px solid #e5e5e3;
  margin-bottom: 1rem;
}
.back-btn {
  text-decoration: none; color: #534AB7; font-size: 14px; font-weight: 600;
}
.header-title { font-size: 18px; font-weight: 700; color: #1a1a1a; }
.header-sub { font-size: 11px; color: #999; margin-top: 2px; }

.updated-at { font-size: 11px; color: #aaa; text-align: right; margin-bottom: 1rem; }

.empty-msg {
  text-align: center; color: #aaa; font-size: 14px;
  padding: 3rem 1rem;
}
.empty-icon { font-size: 48px; margin-bottom: 0.5rem; }

.order-card {
  background: #fff; border-radius: 12px; padding: 1rem;
  box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  margin-bottom: 0.75rem;
  border-left: 4px solid #534AB7;
}
.order-date { font-size: 11px; color: #999; margin-bottom: 0.25rem; }
.order-name { font-size: 16px; font-weight: 700; color: #1a1a1a; margin-bottom: 0.5rem; }
.order-detail { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.order-tag {
  background: #f0f0f0; border-radius: 6px;
  padding: 2px 8px; font-size: 12px; color: #555;
}
.order-tag.qty { background: #EEF2FF; color: #534AB7; font-weight: 600; }

.error-msg {
  background: #FEF2F2; border-radius: 8px; padding: 0.75rem 1rem;
  color: #B91C1C; font-size: 13px; margin-bottom: 1rem;
}

.loading { text-align: center; color: #aaa; padding: 3rem; font-size: 14px; }
</style>
</head>
<body>

<div class="header">
  <a class="back-btn" href="index.html">← 戻る</a>
  <div>
    <div class="header-title">🛒 注文一覧</div>
    <div class="header-sub">横浜ベイシェラトン</div>
  </div>
</div>

<div id="updated-at" class="updated-at"></div>
<div id="content" class="loading">読み込み中...</div>

<script>
async function load() {
  const content = document.getElementById('content');
  const updatedEl = document.getElementById('updated-at');
  try {
    const res = await fetch('orders.json?t=' + Date.now());
    if (!res.ok) throw new Error('注文データが見つかりません');
    const data = await res.json();

    if (data.updated_at) {
      updatedEl.textContent = '最終更新: ' + data.updated_at;
    }

    if (data.error) {
      content.innerHTML = `<div class="error-msg">⚠️ ${data.error}</div>`;
      return;
    }

    const orders = data.orders || [];
    if (orders.length === 0) {
      content.innerHTML = `
        <div class="empty-msg">
          <div class="empty-icon">📭</div>
          <div>現在、注文はありません</div>
        </div>`;
      return;
    }

    let html = '';
    orders.forEach(order => {
      // キーを柔軟に拾う
      const name = order['品目名'] || order['品目'] || order['商品名'] || Object.values(order)[0] || '不明';
      const qty = order['数量'] || order['発注数量'] || '';
      const unit = order['単位'] || '';
      const delivDate = order['納品予定日'] || order['納品日'] || '';
      const orderDate = order['受注日'] || '';
      const hotel = order['納入先'] || order['ホテル'] || '';

      html += `
        <div class="order-card">
          <div class="order-date">${orderDate ? '受注: ' + orderDate : ''}${delivDate ? '　納品: ' + delivDate : ''}</div>
          <div class="order-name">${name}</div>
          <div class="order-detail">
            ${qty ? `<span class="order-tag qty">${qty}${unit}</span>` : ''}
            ${hotel ? `<span class="order-tag">${hotel}</span>` : ''}
            ${Object.entries(order)
              .filter(([k]) => !['品目名','品目','商品名','数量','発注数量','単位','納品予定日','納品日','受注日','納入先','ホテル'].includes(k))
              .map(([k, v]) => `<span class="order-tag">${k}: ${v}</span>`)
              .join('')}
          </div>
        </div>`;
    });
    content.innerHTML = html;
  } catch (e) {
    content.innerHTML = `
      <div class="empty-msg">
        <div class="empty-icon">📭</div>
        <div>注文データを取得できませんでした</div>
        <div style="font-size:12px;margin-top:0.5rem;color:#ccc">${e.message}</div>
      </div>`;
  }
}

load();
</script>
</body>
</html>
