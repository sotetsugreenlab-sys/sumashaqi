<style>

body { font-family: sans-serif; background: #fff; padding: 1rem 0.5rem; }

.today-bar { text-align: center; margin-bottom: 1rem; }

.date-big { font-size: 22px; font-weight: 500; color: #1a1a1a; }

.delivery-row { display: flex; gap: 8px; margin-bottom: 10px; }

.event-banner { background: #FAEEDA; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 12px; }

.card { border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 10px; }

.card-placeholder { background: #f9f9f7; border-radius: 12px; padding: 0.6rem 0.7rem; color: #bbb; font-size: 11px; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 64px; border: 1px dashed #e0e0e0; }
.history { margin-top: 8px; padding-top: 8px; border-top: 0.5px solid rgba(0,0,0,0.1); display: flex; flex-wrap: wrap; gap: 6px; }
.hist-item { font-size: 12px; color: #666; }
.hist-item span { font-weight: 500; color: #1a1a1a; }

.calc-box { background: #f5f5f2; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 10px; }
.calc-title { font-size: 13px; font-weight: 500; color: #666; margin-bottom: 10px; }
.calc-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.calc-tab { font-size: 13px; padding: 4px 14px; border: 0.5px solid #ccc; border-radius: 20px; background: #fff; color: #666; cursor: pointer; }
.calc-tab.active { background: #EEEDFE; border-color: #AFA9EC; color: #534AB7; font-weight: 500; }
.calc-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.calc-row label { font-size: 12px; color: #666; min-width: 48px; }
input[type=date] { font-size: 13px; padding: 5px 8px; border: 0.5px solid #ccc; border-radius: 8px; background: #fff; color: #1a1a1a; }
.btn-calc { font-size: 13px; padding: 5px 16px; border: 0.5px solid #AFA9EC; border-radius: 8px; background: #EEEDFE; color: #534AB7; cursor: pointer; font-weight: 500; }
.btn-calc:hover { background: #CECBF6; }
.calc-result { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.calc-chip { background: #fff; border: 0.5px solid #ccc; border-radius: 8px; padding: 6px 12px; font-size: 13px; color: #1a1a1a; }
.chip-label { font-size: 11px; color: #666; margin-bottom: 2px; display: flex; align-items: center; gap: 4px; }
.chip-day { font-size: 11px; color: #aaa; }
.chip-val { font-weight: 500; font-size: 14px; }

.bag-bar { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; }
.bag-label { font-size: 13px; color: #666; }
.bag-count { font-size: 22px; font-weight: 700; color: #993C1D; line-height: 1; }
.bag-count.low { color: #E24B4A; }

.liquid-label { font-size: 13px; color: #666; }
.liquid-count { font-size: 22px; font-weight: 700; color: #185FA5; line-height: 1; }
.liquid-unit { font-size: 13px; color: #666; }
.liquid-adj-row { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
.liquid-input { width: 56px; font-size: 13px; padding: 4px 6px; border: 0.5px solid #ddd; border-radius: 6px; text-align: center; background: #fafafa; }
.liquid-btn { font-size: 12px; padding: 5px 10px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
.liquid-btn-minus { background: #E6F1FB; color: #185FA5; }
.liquid-btn-plus { background: #EAF3DE; color: #3B6D11; }
.liquid-btn:active { opacity: 0.75; }
.btn-harvest-done { margin-top: 5px; width: 100%; font-size: 11px; font-weight: 500; padding: 4px 0; background: #FAECE7; border: 1px solid #E8A090; border-radius: 8px; color: #993C1D; cursor: pointer; }
.btn-harvest-done:active { background: #F5D5CC; }

.section-title { font-size: 13px; font-weight: 500; color: #666; margin: 1.5rem 0 0.5rem; }
.sheet-note { font-size: 12px; color: #aaa; margin-bottom: 8px; }
.sheet-note a { color: #534AB7; }
.sync-status { font-size: 12px; color: #aaa; margin-top: 6px; }
.sync-status.ok { color: #3B6D11; }
.sync-status.err { color: #E24B4A; }
.staff-line { font-size: 13px; color: #666; margin-top: 5px; }
.staff-line strong { color: #1a1a1a; font-weight: 600; }
.card-notes { margin-top: 6px; padding-top: 5px; border-top: 1px solid rgba(0,0,0,0.07); }
.card-note-item { font-size: 11px; color: #555; line-height: 1.5; margin-bottom: 2px; }
.btn-note-add { font-size: 10px; color: #aaa; background: none; border: 1px dashed #ccc; border-radius: 10px; padding: 2px 8px; cursor: pointer; margin-top: 3px; }
.note-input-wrap { display: none; align-items: center; gap: 4px; margin-top: 5px; }
.note-input-wrap.open { display: flex; }
.note-input { flex: 1; min-width: 0; font-size: 12px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
.btn-note-save { font-size: 11px; padding: 4px 10px; background: #534AB7; color: #fff; border: none; border-radius: 8px; cursor: pointer; flex-shrink: 0; }
.btn-note-cancel { font-size: 11px; color: #aaa; background: none; border: none; cursor: pointer; padding: 2px 4px; flex-shrink: 0; }
.btn-note-edit { font-size: 10px; color: #aaa; background: none; border: none; cursor: pointer; margin-left: 4px; text-decoration: underline; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<div class="today-bar">
  <a class="back-link" href="index.html">← トップ</a>

<div class="calc-box">

</div>

<div class="section-title">イベント登録</div>
<p class="sheet-note">
  イベントは
  <a href="https://docs.google.com/spreadsheets/d/1Ljdufzcvy-BkfzyY6iMU1FqpQxY8fHAXpxyR4hQ81F4/edit" target="_blank">こちらのスプレッドシート</a>
  で管理しています。A列に日付（例：2025-04-16）、B列に内容を入力してください。
</p>
<div class="sync-status" id="sync-status">読み込み中...</div>

<script>
// Supabase（貯液管理）
const db = supabase.createClient(
  'https://pqoexlikdviqqgdnzuud.supabase.co',
  'sb_publishable_9KR8h4be2Q5-4ux6g55hSg_Jkv9UYBM'
);

let liquidAmount = 0;
let shiftsCache = {};

async function loadShifts() {
  const { data, error } = await db.from('shifts').select('shift_date,cultivation_staff,other_staff');
  if (error) { console.error(error); return; }
  (data || []).forEach(r => { shiftsCache[r.shift_date] = { cult: r.cultivation_staff || [], other: r.other_staff || [] }; });
  renderShift();
}

function renderShift() {
  const s = shiftsCache[toDateStr(viewDate)];
  if (!s || (s.cult.length === 0 && s.other.length === 0)) {
    document.getElementById('staff-banner').innerHTML = ''; return;
  }
  const parts = [
    ...s.other.map(n => `<span style="color:#3B8A28;font-weight:600">${n}</span>`),
    ...s.cult.map(n => `<strong>${n}</strong>`),
  ];
  document.getElementById('staff-banner').innerHTML =
    `<div class="staff-line">${parts.join('・')}</div>`;
}

async function loadLiquidStock() {
  const { data, error } = await db.from('liquid_log').select('delta');
  if (error) { console.error(error); return; }
  liquidAmount = (data || []).reduce((sum, r) => sum + (r.delta || 0), 0);
  renderLiquidStock();
}

function renderLiquidStock() {
  const el = document.getElementById('liquid-display');
  const val = Math.round(liquidAmount * 10) / 10;
  el.textContent = val % 1 === 0 ? val : val.toFixed(1);
}

async function adjustLiquid(sign) {
  const inputId = sign < 0 ? 'liquid-used' : 'liquid-made';
  const val = parseFloat(document.getElementById(inputId).value);
  if (!val || val <= 0) return;
  const delta = sign * val;
  const { error } = await db.from('liquid_log').insert({ delta });
  if (error) { console.error(error); return; }
  document.getElementById(inputId).value = '';
  liquidAmount += delta;
  renderLiquidStock();
}

// 全端末リアルタイム同期
db.channel('liquid_log_changes')
  .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'liquid_log' }, payload => {
    liquidAmount += payload.new.delta;
    renderLiquidStock();
  })
  .subscribe();

loadLiquidStock();

const SHEET_ID = '1Ljdufzcvy-BkfzyY6iMU1FqpQxY8fHAXpxyR4hQ81F4';
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

// 35日コース: 播種(0日)→30穴(6日)→5穴(16日)→刈取(35日)
// 36日コース: 播種(0日)→30穴(7日)→5穴(17日)→刈取(36日)

// 液肥管理
const EKIHI_BASE = new Date(2026, 2, 2); // 2026-03-02（入替の基準日）
const EKIHI_EVENTS = [
  { label: '入替', offset: 0 },
  { label: '追肥', offset: 4 },
  { label: '追肥', offset: 9 },
];

// 日付ユーティリティ
function fmt(date) {
  const w = ['日','月','火','水','木','金','土'][date.getDay()];
  return `${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日（${w}）`;
}
function fmtShort(date) { return `${date.getMonth()+1}/${date.getDate()}`; }
function fmtMD(date) {
  const w = ['日','月','火','水','木','金','土'][date.getDay()];
  return `${date.getMonth()+1}月${date.getDate()}日（${w}）`;
}
function toDateStr(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate()+n); return d; }
function parseDate(str) { const [y,m,d] = str.split('-').map(Number); return new Date(y,m-1,d); }
function isSameDay(a, b) { return toDateStr(a) === toDateStr(b); }

// 表示日（ナビゲーションで変わる）
const realToday = new Date();
let viewDate = new Date(realToday);

// 袋在庫 - 基準日から毎日1組減（在庫が変わったらここを更新）
const BAG_BASE_DATE = '2026-08-05';
const BAG_BASE_COUNT = 27;

function renderBagCount() {
  const daysDiff = Math.round((parseDate(toDateStr(viewDate)) - parseDate(BAG_BASE_DATE)) / 86400000);
  const count = Math.max(0, BAG_BASE_COUNT - daysDiff);
  const el = document.getElementById('bag-count-display');
  el.textContent = count;
  el.className = 'bag-count' + (count <= 3 ? ' low' : '');
}

function navigate(delta) {
  viewDate = addDays(viewDate, delta);
  renderAll();
}

function goToday() {
  viewDate = new Date(realToday);
  renderAll();
}

function renderHeader() {
  document.getElementById('disp-date').textContent = fmt(viewDate);
  const wrap = document.getElementById('back-today-wrap');
  wrap.innerHTML = isSameDay(viewDate, realToday)
    ? ''
    : `<button class="back-today" onclick="goToday()">今日に戻る</button>`;
}

let lotNotes = {};
async function loadLotNotes() {
  const { data } = await db.from('lot_notes').select('id,sow_date,note').eq('crop', 'sumashaqi');
  lotNotes = {};
  (data || []).forEach(r => {
    if (!lotNotes[r.sow_date]) lotNotes[r.sow_date] = [];
    lotNotes[r.sow_date].push({ id: r.id, note: r.note });
  });
  renderTasks();
}
function openNote(id) {
  const el = document.getElementById(id);
  el.classList.add('open');
  document.getElementById(id + '-t').focus();
}
function closeNote(id) {
  document.getElementById(id).classList.remove('open');
}
async function submitNote(crop, sowDate) {
  const id = 'ni-' + sowDate;
  const input = document.getElementById(id + '-t');
  const text = input.value.trim();
  if (!text) return;
  const { data } = await db.from('lot_notes').insert({ crop, sow_date: sowDate, note: text }).select('id');
  if (!lotNotes[sowDate]) lotNotes[sowDate] = [];
  lotNotes[sowDate].push({ id: data?.[0]?.id, note: text });
  input.value = '';
  closeNote(id);
  renderTasks();
}
function startEdit(noteId, sowKey) {
  const notes = lotNotes[sowKey] || [];
  const note = notes.find(n => n.id === noteId);
  if (!note) return;
  const wrap = document.getElementById('ew-' + noteId);
  wrap.style.display = 'flex';
  const input = document.getElementById('ei-' + noteId);
  input.value = note.note;
  input.focus();
}
function cancelEdit(noteId) {
  document.getElementById('ew-' + noteId).style.display = 'none';
}
async function saveEdit(noteId, sowKey) {
  const input = document.getElementById('ei-' + noteId);
  const text = input.value.trim();
  if (!text) return;
  await db.from('lot_notes').update({ note: text }).eq('id', noteId);
  const notes = lotNotes[sowKey] || [];
  const item = notes.find(n => n.id === noteId);
  if (item) item.note = text;
  renderTasks();
}
async function deleteNote(noteId, sowKey) {
  if (!confirm('このメモを削除しますか？')) return;
  await db.from('lot_notes').delete().eq('id', noteId);
  if (lotNotes[sowKey]) lotNotes[sowKey] = lotNotes[sowKey].filter(n => n.id !== noteId);
  renderTasks();
}
function notesHtml(sowDateStr) {
  const notes = lotNotes[sowDateStr] || [];
  const id = 'ni-' + sowDateStr;
  const items = notes.map(n => `
    <div class="card-note-item">📝 ${n.note}
      <button class="btn-note-edit" onclick="startEdit(${n.id},'${sowDateStr}')">編集</button>
      <button class="btn-note-edit" onclick="deleteNote(${n.id},'${sowDateStr}')" style="color:#E24B4A">削除</button>
    </div>
    <div class="note-input-wrap" id="ew-${n.id}" style="display:none">
      <input class="note-input" id="ei-${n.id}" onkeydown="if(event.key==='Enter')saveEdit(${n.id},'${sowDateStr}')">
      <button class="btn-note-save" onclick="saveEdit(${n.id},'${sowDateStr}')">保存</button>
      <button class="btn-note-cancel" onclick="cancelEdit(${n.id})">✕</button>
    </div>`).join('');
  return `<div class="card-notes">
    ${items}
    <div id="${id}" class="note-input-wrap">
      <input class="note-input" id="${id}-t" placeholder="メモを入力…" onkeydown="if(event.key==='Enter')submitNote('sumashaqi','${sowDateStr}')">
      <button class="btn-note-save" onclick="submitNote('sumashaqi','${sowDateStr}')">保存</button>
      <button class="btn-note-cancel" onclick="closeNote('${id}')">✕</button>
    </div>
    <button class="btn-note-add" onclick="openNote('${id}')">＋ メモ</button>
  </div>`;
}

db.channel('lot_notes_sumashaqi')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'lot_notes' }, payload => {
    if (payload.new?.crop === 'sumashaqi') {
      const d = payload.new.sow_date;
      if (!lotNotes[d]) lotNotes[d] = [];
      const existing = lotNotes[d].find(n => n.id === payload.new.id);
      if (existing) existing.note = payload.new.note;
      else lotNotes[d].push({ id: payload.new.id, note: payload.new.note });
      renderTasks();
    }
  })
  .subscribe();

const TRAY_COLORS = [
  '#CBE8A2', // 黄緑
  '#F5C8D6', // ピンク
  '#FAF0A8', // 黄色
  '#FAF8F0', // クリーム
  '#B8D8F0', // 青
];
const TRAY_REF = new Date('2026-08-04T00:00:00');
function sowTrayBg(sow) {
  const diff = Math.round((sow - TRAY_REF) / 86400000);
  return TRAY_COLORS[((diff % 5) + 5) % 5];
}

function makeCard(t, dayLabel, compact) {
  const cls = compact ? `card ${t.cls} compact` : `card ${t.cls}`;
  const bg = sowTrayBg(t.sow);
  let histHtml = '';
  if (t.history.length > 0) {
    histHtml = '<div class="history">';
    t.history.forEach((h, i) => {
      const hDate = addDays(t.sow, h.daysFromSow);
      histHtml += `<span class="hist-item"><span>${fmtShort(hDate)}</span> ${h.label}</span>`;
      if (i < t.history.length - 1) histHtml += `<span class="hist-sep">›</span>`;
    });
    histHtml += '</div>';
  }
  const sowStr = toDateStr(t.sow);
  if (compact) {
    return `<div class="${cls}" style="background:${bg}">
      <div class="card-task">${t.label}</div>
      <div class="card-sow">${fmtShort(t.sow)}播種</div>
      <div class="card-sub">${t.days}日目</div>
      ${histHtml}
      ${notesHtml(sowStr)}
    </div>`;
  }
  return `<div class="${cls}" style="background:${bg}">
    <div class="card-top">
      <div>
        <div class="card-task">${dayLabel}${t.label}</div>
        <div class="card-sow">${fmtShort(t.sow)}播種</div>
      </div>
      <div class="card-sub">播種から${t.days}日目</div>
    </div>
    ${histHtml}
    ${notesHtml(sowStr)}
  </div>`;
}

function cardCell(t, dayLabel) {
  return `<div class="stage-cell">${makeCard(t, dayLabel, true)}</div>`;
}

function renderTasks() {
  const isToday = isSameDay(viewDate, realToday);

  const courses = [31, 32, 33];

  const hist5 = [{label:'30穴',daysFromSow:6}];
  const sow5  = addDays(viewDate, -16);
  const sow30 = addDays(viewDate, -6);

  let html = `<div class="col-header">
    ${courses.map(c => `<div class="col-label" style="background:#f0f0ee;color:#555">${c}日目刈取</div>`).join('')}
  </div>
  <div class="stage-row">
    ${courses.map(c => cardCell({label:'刈取', cls:'card-刈取', days:c, sow:addDays(viewDate,-c), history:hist}, dayLabel)).join('')}

  </div>`;

  html += `<div class="stage-row-full">
    ${cardCell({label:'30穴へ移植', cls:'card-30穴', days:6, sow:sow30, history:[]}, dayLabel)}
  </div>`;

  document.getElementById('tasks').innerHTML = html;
}

function renderEkihi() {
  const ms = new Date(viewDate.getFullYear(), viewDate.getMonth(), viewDate.getDate()).getTime();
  const daysSinceBase = Math.round((ms - EKIHI_BASE.getTime()) / 86400000);
  const cycleNum = Math.floor(daysSinceBase / 14);
  const hit = EKIHI_EVENTS.find(e => (cycleNum * 14 + e.offset) === daysSinceBase);
  const el = document.getElementById('ekihi-line');
  if (hit) {
    el.textContent = `液肥管理：${hit.label}`;
    el.style.display = '';
  } else {
    el.style.display = 'none';
  }
}

function renderBanner(events) {
  const dateStr = toDateStr(viewDate);
  const matched = events.filter(e => e.date === dateStr);
  const el = document.getElementById('event-banner');
  if (matched.length === 0) { el.innerHTML = ''; return; }
  const items = matched.map(e => `<div class="event-banner-item">★ ${e.note}</div>`).join('');
  el.innerHTML = `<div class="event-banner"><div class="event-banner-title">イレギュラー</div>${items}</div>`;
}

// 計算機
let calcCourse = '31';

function chip(label, dayNum, date) {
  const dayStr = dayNum === 0 ? '0日目（播種）' : `${dayNum}日目`;
  return `<div class="calc-chip">
    <div class="chip-label">${label} <span class="chip-day">${dayStr}</span></div>
    <div class="chip-val">${fmtMD(date)}</div>
  </div>`;
}
function selectCourse(ver) {
  calcCourse = ver;
  [31,32,33,34,35].forEach(c => {
    document.getElementById(`tab-course-${c}`).classList.toggle('active', String(c) === ver);
  });
  document.getElementById('sow-result').innerHTML = '';
  document.getElementById('harvest-result').innerHTML = '';
}
function switchCalcDir(dir) {
  document.getElementById('tab-sow').classList.toggle('active', dir === 'sow');
  document.getElementById('tab-harvest').classList.toggle('active', dir === 'harvest');
  document.getElementById('panel-sow').style.display = dir === 'sow' ? '' : 'none';
  document.getElementById('panel-harvest').style.display = dir === 'harvest' ? '' : 'none';
}
function schForSow(ver) {
  return [
    { label: '30穴', days: 6 },
    { label: '5穴',  days: 16 },
    { label: '刈取', days: parseInt(ver) },
  ];
}
function calcFromSow() {
  const val = document.getElementById('sow-input').value;
  if (!val) return;
  const sow = parseDate(val);
  document.getElementById('sow-result').innerHTML =
    [chip('播種日', 0, sow)].concat(schForSow(calcCourse).map(s => chip(s.label, s.days, addDays(sow, s.days)))).join('');
}
function calcDaysSinceSow() {
  const val = document.getElementById('sow-days-input').value;
  if (!val) return;
  const sow = parseDate(val);
  const today = parseDate(toDateStr(realToday));
  const diff = Math.round((today - sow) / 86400000);
  const el = document.getElementById('sow-days-result');
  if (diff < 0) {
    el.innerHTML = `<div class="calc-chip">播種まであと${-diff}日</div>`;
  } else {
    el.innerHTML = `<div class="calc-chip" style="font-size:16px;font-weight:700;color:#534AB7">${diff}日目</div>`;
  }
}
function calcFromHarvest() {
  const val = document.getElementById('harvest-input').value;
  if (!val) return;
  const sow = addDays(parseDate(val), -parseInt(calcCourse));
  document.getElementById('harvest-result').innerHTML =
    [chip('播種日', 0, sow)].concat(schForSow(calcCourse).map(s => chip(s.label, s.days, addDays(sow, s.days)))).join('');
}
document.getElementById('sow-input').value = toDateStr(realToday);
document.getElementById('harvest-input').value = toDateStr(realToday);

// イベント読み込み
let cachedEvents = null;
function parseCSV(text) {
  // セル内改行を含むCSVを正しくパース
  const rows = [];
  let cur = '', inQ = false, cols = [];
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') {
      if (inQ && text[i+1] === '"') { cur += '"'; i++; } // エスケープ済み引用符
      else { inQ = !inQ; }
    } else if (c === ',' && !inQ) {
      cols.push(cur); cur = '';
    } else if ((c === '\n' || (c === '\r' && text[i+1] === '\n')) && !inQ) {
      if (c === '\r') i++;
      cols.push(cur); cur = '';
      rows.push(cols); cols = [];
    } else {
      cur += c;
    }
  }
  if (cur || cols.length) { cols.push(cur); rows.push(cols); }

  return rows.slice(1).map(cols => ({
    date: (cols[0] || '').trim(),
    note: (cols[1] || '').trim().replace(/\n/g, ' '),
  })).filter(e => e.date && e.note);
}
async function loadEvents() {
  const status = document.getElementById('sync-status');
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    cachedEvents = parseCSV(text);
    renderBanner(cachedEvents);
    status.textContent = `最終更新：${fmt(new Date())}`;
    status.className = 'sync-status ok';
  } catch(e) {
    cachedEvents = [];
    renderBanner([]);
    status.textContent = 'スプレッドシートを読み込めませんでした。ネット接続を確認してください。';
    status.className = 'sync-status err';
  }
}

renderAll();
loadEvents();
loadShifts();
