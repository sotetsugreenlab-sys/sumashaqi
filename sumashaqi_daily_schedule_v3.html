<script>
// Supabase（貯液管理）
const db = supabase.createClient(
  'https://pqoexlikdviqqgdnzuud.supabase.co',
  'sb_publishable_9KR8h4be2Q5-4ux6g55hSg_Jkv9UYBM'
);

let liquidAmount = 0;
let shiftsCache = {};

async function loadShifts() {
  const { data, error } = await db.from('shifts').select('shift_date,cultivation_staff,other_staff');
  if (error) { console.error(error); return; }
  (data || []).forEach(r => { shiftsCache[r.shift_date] = { cult: r.cultivation_staff || [], other: r.other_staff || [] }; });
  renderShift();
}

function renderShift() {
  const s = shiftsCache[toDateStr(viewDate)];
  if (!s || (s.cult.length === 0 && s.other.length === 0)) {
    document.getElementById('staff-banner').innerHTML = ''; return;
  }
  const parts = [
    ...s.other.map(n => `<span style="color:#3B8A28;font-weight:600">${n}</span>`),
    ...s.cult.map(n => `<strong>${n}</strong>`),
  ];
  document.getElementById('staff-banner').innerHTML =
    `<div class="staff-line">${parts.join('・')}</div>`;
}

async function loadLiquidStock() {
  const { data, error } = await db.from('liquid_log').select('delta');
  if (error) { console.error(error); return; }
  liquidAmount = (data || []).reduce((sum, r) => sum + (r.delta || 0), 0);
  renderLiquidStock();
}

function renderLiquidStock() {
  const el = document.getElementById('liquid-display');
  const val = Math.round(liquidAmount * 10) / 10;
  el.textContent = val % 1 === 0 ? val : val.toFixed(1);
}

async function adjustLiquid(sign) {
  const inputId = sign < 0 ? 'liquid-used' : 'liquid-made';
  const val = parseFloat(document.getElementById(inputId).value);
  if (!val || val <= 0) return;
  const delta = sign * val;
  const { error } = await db.from('liquid_log').insert({ delta });
  if (error) { console.error(error); return; }
  document.getElementById(inputId).value = '';
  liquidAmount += delta;
  renderLiquidStock();
}

// 全端末リアルタイム同期
db.channel('liquid_log_changes')
  .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'liquid_log' }, payload => {
    liquidAmount += payload.new.delta;
    renderLiquidStock();
  })
  .subscribe();

loadLiquidStock();

const SHEET_ID = '1Ljdufzcvy-BkfzyY6iMU1FqpQxY8fHAXpxyR4hQ81F4';
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

// 35日コース: 播種(0日)→30穴(6日)→5穴(17日)→刈取(35日)
// 36日コース: 播種(0日)→30穴(7日)→5穴(17日)→刈取(36日)

// 液肥管理
const EKIHI_BASE = new Date(2026, 2, 2); // 2026-03-02（入替の基準日）
const EKIHI_EVENTS = [
  { label: '入替', offset: 0 },
  { label: '追肥', offset: 4 },
  { label: '追肥', offset: 9 },
];

// 日付ユーティリティ
function fmt(date) {
  const w = ['日','月','火','水','木','金','土'][date.getDay()];
  return `${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日（${w}）`;
}
function fmtShort(date) { return `${date.getMonth()+1}/${date.getDate()}`; }
function fmtMD(date) {
  const w = ['日','月','火','水','木','金','土'][date.getDay()];
  return `${date.getMonth()+1}月${date.getDate()}日（${w}）`;
}
function toDateStr(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate()+n); return d; }
function parseDate(str) { const [y,m,d] = str.split('-').map(Number); return new Date(y,m-1,d); }
function isSameDay(a, b) { return toDateStr(a) === toDateStr(b); }

let lotNotes = {};
let alertLots = {}; // sow_date -> row id
async function loadLotNotes() {
  const [notesRes, alertRes, irregularRes, harvestOrdRes] = await Promise.all([
    db.from('lot_notes').select('id,sow_date,note').eq('crop', 'sumashaqi'),
    db.from('lot_notes').select('id,sow_date').eq('crop', 'sumashaqi_alert'),
    db.from('lot_notes').select('id,sow_date,note').eq('crop', 'lot_irregular'),
    db.from('lot_notes').select('id,sow_date,note').eq('crop', 'harvest_order_irregular'),
  ]);
  lotNotes = {};
  (notesRes.data || []).forEach(r => {
    if (!lotNotes[r.sow_date]) lotNotes[r.sow_date] = [];
    lotNotes[r.sow_date].push({ id: r.id, note: r.note });
  });
  alertLots = {};
  (alertRes.data || []).forEach(r => { alertLots[r.sow_date] = r.id; });
  harvestOrderIrr = {};
  (harvestOrdRes.data || []).forEach(r => {
    try { harvestOrderIrr[r.sow_date] = { id: r.id, ...JSON.parse(r.note || '{}') }; } catch(e) {}
  });
  lotIrregularsGiven = {};
  lotIrregularsReceived = {};
  (irregularRes.data || []).forEach(r => {
    try {
      const p = JSON.parse(r.note || '{}');
      const entry = { id: r.id, from_sow_date: r.sow_date, to_sow_date: p.to_sow_date, count: p.count };
      if (!lotIrregularsGiven[r.sow_date]) lotIrregularsGiven[r.sow_date] = [];
      lotIrregularsGiven[r.sow_date].push(entry);
      if (p.to_sow_date) {
        if (!lotIrregularsReceived[p.to_sow_date]) lotIrregularsReceived[p.to_sow_date] = [];
        lotIrregularsReceived[p.to_sow_date].push(entry);
      }
    } catch(e) {}
  });
  renderTasks();
}
async function toggleAlert(sowDateStr) {
  if (alertLots[sowDateStr]) {
    await db.from('lot_notes').delete().eq('id', alertLots[sowDateStr]);
    delete alertLots[sowDateStr];
  } else {
    const { data } = await db.from('lot_notes').insert({ crop: 'sumashaqi_alert', sow_date: sowDateStr, note: '1' }).select('id');
    if (data?.[0]) alertLots[sowDateStr] = data[0].id;
  }
  renderTasks();
}
function openNote(id) {
  const el = document.getElementById(id);

}
function closeNote(id) {

}
async function submitNote(crop, sowDate) {
  const id = 'ni-' + sowDate;
  const input = document.getElementById(id + '-t');
  const text = input.value.trim();
  if (!text) return;
  const { data } = await db.from('lot_notes').insert({ crop, sow_date: sowDate, note: text }).select('id');
  if (!lotNotes[sowDate]) lotNotes[sowDate] = [];
  lotNotes[sowDate].push({ id: data?.[0]?.id, note: text });

function startEdit(noteId, sowKey) {
  const notes = lotNotes[sowKey] || [];

  const wrap = document.getElementById('ew-' + noteId);
  wrap.style.display = 'flex';
  const input = document.getElementById('ei-' + noteId);
  input.value = note.note;
  input.focus();

async function saveEdit(noteId, sowKey) {
  const input = document.getElementById('ei-' + noteId);
  const text = input.value.trim();
  if (!text) return;
  await db.from('lot_notes').update({ note: text }).eq('id', noteId);

  const item = notes.find(n => n.id === noteId);
  if (item) item.note = text;
  renderTasks();

function showDeleteConfirm(noteId) {

function hideDeleteConfirm(noteId) {

async function confirmDelete(noteId, sowKey) {

db.channel('lot_notes_sumashaqi')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'lot_notes' }, payload => {

// 刈取カウント（前借り・出荷報告）
// lot_notesテーブルを流用: crop='harvest_count', sow_date='YYYY-MM-DD_33'(前借り) / 'YYYY-MM-DD_34'(出荷) など
// note = JSON文字列 {"maegari":5} or {"min_weight":0,"avg_weight":0,"w70":0,"w75":0,...}
let harvestCounts = {}; // key: `${dateStr}_${course}` -> { id, maegari, min_weight, avg_weight, w70, w75, yoku_bukuro, sheraton_count, sheraton_weight, chipburn }
let hcDebounce = {};
let irregularForms = {}; // key: `${dateStr}_${course}` -> {open: bool}
let lotIrregularsGiven = {}; // from_sow_date -> [{id, from_sow_date, to_sow_date, count}]
let lotIrregularsReceived = {}; // to_sow_date -> [{id, from_sow_date, to_sow_date, count}]
let harvestOrderIrr = {}; // dateStr -> { id, main_sow }
let harvestIrrFormOpen = false;

const HC34_FIELDS = ['min_weight','avg_weight','w70','w75','yoku_bukuro','sheraton_count','sheraton_weight','chipburn'];

async function loadHarvestCounts(dateStr) {
  const { data } = await db.from('lot_notes')
    .select('id,sow_date,note')
    .eq('crop', 'harvest_count')
    .like('sow_date', `${dateStr}_%`);
  (data || []).forEach(r => {
    try {
      const parsed = JSON.parse(r.note || '{}');
      harvestCounts[r.sow_date] = { id: r.id, ...parsed };
    } catch(e) {}
  });
  [33, 34, 'irr'].forEach(c => {
    const key = `${dateStr}_${c}`;
    const counts = harvestCounts[key] || {};
    const fields = c === 33 ? ['maegari'] : HC34_FIELDS;
    fields.forEach(f => {
      const el = document.getElementById(`hcount-${c}-${f}`);
      if (el && document.activeElement !== el) el.value = counts[f] != null ? counts[f] : '';
    });
  });
}

function onHarvestInput(course, field) {
  const dateStr = toDateStr(viewDate);
  const key = `${dateStr}_${course}`;
  const debKey = `${key}_${field}`;
  clearTimeout(hcDebounce[debKey]);
  hcDebounce[debKey] = setTimeout(async () => {
    const el = document.getElementById(`hcount-${course}-${field}`);
    if (!el) return;
    const val = parseInt(el.value) || 0;
    if (!harvestCounts[key]) harvestCounts[key] = {};
    harvestCounts[key][field] = val;
    const c = harvestCounts[key];
    const note = course === 33
      ? JSON.stringify({ maegari: c.maegari || 0 })
      : JSON.stringify(Object.fromEntries(HC34_FIELDS.map(f => [f, c[f] || 0])));
    if (c.id) {
      await db.from('lot_notes').update({ note }).eq('id', c.id);
    } else {
      const { data } = await db.from('lot_notes').insert({ crop: 'harvest_count', sow_date: key, note }).select('id');
      if (data && data[0]) harvestCounts[key].id = data[0].id;
    }
  }, 600);
}

function toggleIrregular(dateStr, course) {
  const key = `${dateStr}_${course}`;
  if (!irregularForms[key]) irregularForms[key] = { open: false };
  irregularForms[key].open = !irregularForms[key].open;
  renderTasks();
  if (irregularForms[key].open) {
    setTimeout(() => document.getElementById(`irr-from-${key}`)?.focus(), 50);
  }
}

async function submitIrregular(viewDateStr, sowDateStr, course) {
  const key = `${viewDateStr}_${course}`;
  const fromDate = document.getElementById(`irr-from-${key}`)?.value;
  const count = parseInt(document.getElementById(`irr-count-${key}`)?.value) || 0;
  if (!fromDate || !count) { alert('日付と株数を入力してください'); return; }

  // 提供元ロット(fromDate)が受取ロット(sowDateStr)に株を提供したことを記録
  const note = JSON.stringify({ to_sow_date: sowDateStr, count });
  const { data } = await db.from('lot_notes').insert({ crop: 'lot_irregular', sow_date: fromDate, note }).select('id');

  const entry = { id: data?.[0]?.id, from_sow_date: fromDate, to_sow_date: sowDateStr, count };
  if (!lotIrregularsGiven[fromDate]) lotIrregularsGiven[fromDate] = [];
  lotIrregularsGiven[fromDate].push(entry);
  if (!lotIrregularsReceived[sowDateStr]) lotIrregularsReceived[sowDateStr] = [];
  lotIrregularsReceived[sowDateStr].push(entry);

  irregularForms[key].open = false;
  renderTasks();
}

}

async function submitHarvestIrr(dateStr, mainSow) {

const TRAY_COLORS = [
  'rgba(160, 210, 100, 0.35)', // 黄緑
  'rgba(230, 160, 185, 0.35)', // ピンク
  'rgba(240, 220, 100, 0.35)', // 黄色
  'rgba(235, 220, 175, 0.35)', // クリーム
  'rgba(130, 185, 225, 0.35)', // 青
];
const TRAY_REF = new Date('2026-08-04T00:00:00');
function sowTrayBg(sow) {
  const diff = Math.round((sow - TRAY_REF) / 86400000);
  return TRAY_COLORS[((diff % 5) + 5) % 5];
}

function irregularGivenTotal(sowStr) {
  return (lotIrregularsGiven[sowStr] || []).reduce((s, e) => s + (e.count || 0), 0);
}

function makeCard(t, dayLabel, compact) {
  const cls = compact ? `card ${t.cls} compact` : `card ${t.cls}`;
  const bg = sowTrayBg(t.sow);
  let histHtml = '';
  if (t.history.length > 0) {
    histHtml = '<div class="history">';
    t.history.forEach((h, i) => {
      const hDate = addDays(t.sow, h.daysFromSow);
      histHtml += `<span class="hist-item"><span>${fmtShort(hDate)}</span> ${h.label}</span>`;
      if (i < t.history.length - 1) histHtml += `<span class="hist-sep">›</span>`;
    });
    histHtml += '</div>';
  }
  const sowStr = toDateStr(t.sow);
  const manualAlert = !!(alertLots[sowStr]);
  const givenTotal = irregularGivenTotal(sowStr);
  const autoAlert = givenTotal >= 5;
  const hasAlert = manualAlert || autoAlert;
  const dateStr = toDateStr(viewDate);
  const isIrrMain = harvestOrderIrr[dateStr]?.main_sow === sowStr;
  let alertBanner = '';
  if (autoAlert) {
    alertBanner = `<div class="card-alert-banner">⚠️ ${givenTotal}株前借り済</div>`;
  } else if (manualAlert) {
    alertBanner = `<div class="card-alert-banner">⚠️ 注意ロット</div>`;
  }
  const irrMainBadge = isIrrMain ? `<div class="irr-main-badge">🔀 本日メイン刈取</div>` : '';
  const outlineStyle = isIrrMain ? ';outline:2px solid #534AB7' : hasAlert ? ';outline:2px solid #E24B4A' : '';
  if (compact) {
    return `<div class="${cls}" style="background:${bg}${outlineStyle}" data-sow="${sowStr}">
      ${irrMainBadge}
      ${alertBanner}
      <div class="card-task">${t.label}</div>
      <div class="card-sow">${fmtShort(t.sow)}播種</div>
      <div class="card-sub">${t.days}日目</div>
      ${histHtml}
      ${notesHtml(sowStr)}
    </div>`;
  }
  return `<div class="${cls}" style="background:${bg}${outlineStyle}" data-sow="${sowStr}">
    ${irrMainBadge}
    ${alertBanner}
    <div class="card-top">
      <div>
        <div class="card-task">${dayLabel}${t.label}</div>
        <div class="card-sow">${fmtShort(t.sow)}播種</div>
      </div>
      <div class="card-sub">播種から${t.days}日目</div>
    </div>
    ${histHtml}
    ${notesHtml(sowStr)}
  </div>`;
}

function cardCell(t, dayLabel) {
  return `<div class="stage-cell">${makeCard(t, dayLabel, true)}</div>`;
}

let cachedEvents = null;
function parseCSV(text) {
  // セル内改行を含むCSVを正しくパース
  const rows = [];
  let cur = '', inQ = false, cols = [];
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') {
      if (inQ && text[i+1] === '"') { cur += '"'; i++; } // エスケープ済み引用符
      else { inQ = !inQ; }
    } else if (c === ',' && !inQ) {
      cols.push(cur); cur = '';
    } else if ((c === '\n' || (c === '\r' && text[i+1] === '\n')) && !inQ) {
      if (c === '\r') i++;
      cols.push(cur); cur = '';
      rows.push(cols); cols = [];
    } else {
      cur += c;
    }
  }
  if (cur || cols.length) { cols.push(cur); rows.push(cols); }

  return rows.slice(1).map(cols => ({
    date: (cols[0] || '').trim(),
    note: (cols[1] || '').trim().replace(/\n/g, ' '),
  })).filter(e => e.date && e.note);
}
async function loadEvents() {
  const status = document.getElementById('sync-status');
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    cachedEvents = parseCSV(text);
    renderBanner(cachedEvents);
    status.textContent = `最終更新：${fmt(new Date())}`;
    status.className = 'sync-status ok';
  } catch(e) {
    cachedEvents = [];
    renderBanner([]);
    status.textContent = 'スプレッドシートを読み込めませんでした。ネット接続を確認してください。';
    status.className = 'sync-status err';
  }
}

  const targetDate = toDateStr(viewDate);
  renderMorningCheck();
  const { data } = await db.from('lot_notes')
    .select('id,note').eq('crop','morning_check').eq('sow_date', targetDate).limit(1);
  if (toDateStr(viewDate) !== targetDate) return;
  if (data && data.length > 0) {
    mcRowId = data[0].id;
    try { mcState = JSON.parse(data[0].note); } catch(e) { mcState = {}; }
  }
  renderMorningCheck();
}

async function toggleMC(id) {
  mcState[id] = !mcState[id];
  renderMorningCheck();
  const noteStr = JSON.stringify(mcState);
  if (mcRowId) {
    await db.from('lot_notes').update({ note: noteStr }).eq('id', mcRowId);
  } else {
    const { data } = await db.from('lot_notes')
      .insert({ crop: 'morning_check', sow_date: toDateStr(viewDate), note: noteStr }).select('id');
    if (data && data.length > 0) mcRowId = data[0].id;
  }
}

    if (item.type === 'ac') return renderAcRow(item, ecState, 'toggleEC');
    const checked = !!ecState[item.id];
    return `<div class="mc-item${checked ? ' checked' : ''}" onclick="toggleEC('${item.id}')">
      <div class="mc-box${checked ? ' checked' : ''}"><span class="mc-check">✓</span></div>
      <div class="mc-label">${item.label}</div>
    </div>`;
  }).join('');
  const allDone = checkAllDone(EC_ITEMS, ecState);
  wrap.innerHTML = `<div class="morning-check">
    <div class="morning-check-title">🌙 帰りのチェック</div>
    <div>${itemsHtml}</div>
    <div class="mc-all-done${allDone ? ' show' : ''}">✅ すべて完了！</div>
  </div>`;
}

async function initEveningCheck() {
  const targetDate = toDateStr(viewDate);
  renderEveningCheck();
  const { data } = await db.from('lot_notes')
    .select('id,note').eq('crop','evening_check').eq('sow_date', targetDate).limit(1);
  if (toDateStr(viewDate) !== targetDate) return;
  if (data && data.length > 0) {
    ecRowId = data[0].id;
    try { ecState = JSON.parse(data[0].note); } catch(e) { ecState = {}; }
  }
  renderEveningCheck();
}

async function toggleEC(id) {
  ecState[id] = !ecState[id];
  renderEveningCheck();
  const noteStr = JSON.stringify(ecState);
  if (ecRowId) {
    await db.from('lot_notes').update({ note: noteStr }).eq('id', ecRowId);
  } else {
    const { data } = await db.from('lot_notes')
      .insert({ crop: 'evening_check', sow_date: toDateStr(viewDate), note: noteStr }).select('id');
    if (data && data.length > 0) ecRowId = data[0].id;
  }
}

renderAll();
loadEvents();
loadShifts();
loadLotNotes();
</script>
