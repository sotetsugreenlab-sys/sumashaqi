<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タイムアタック</title>
<link rel="apple-touch-icon" href="Saibai%20Cat.png">
<link rel="icon" href="Saibai%20Cat.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="タイムアタック">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #f7f7f5; padding: 1rem 0.75rem 3rem; }

.header { text-align: center; margin-bottom: 1.25rem; }
.back-link { display: inline-block; font-size: 13px; color: #534AB7; background: #EEEDFE; border-radius: 20px; padding: 4px 14px; text-decoration: none; margin-bottom: 10px; }
.page-title { font-size: 20px; font-weight: 600; color: #1a1a1a; }
.page-date { font-size: 12px; color: #999; margin-top: 3px; }

/* Timer card */
.timer-card {
  background: #fff;
  border-radius: 16px;
  padding: 1rem 1rem 1.25rem;
  margin-bottom: 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.07);
}
.timer-label { font-size: 11px; font-weight: 600; color: #aaa; letter-spacing: 0.06em; margin-bottom: 10px; }

/* Name & process buttons */
.section-label { font-size: 10px; color: #aaa; font-weight: 600; letter-spacing: 0.05em; margin: 10px 0 5px; }
.btn-group { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
.btn-name, .btn-proc {
  font-size: 13px; padding: 5px 10px; border: 1px solid #e0e0e0;
  border-radius: 20px; background: #fff; color: #555; cursor: pointer;
  transition: all 0.1s;
}
.btn-name.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; font-weight: 600; }
.btn-proc.active { background: #E8401C; color: #fff; border-color: #E8401C; font-weight: 600; }

.memo-input {
  width: 100%; margin-top: 6px; padding: 7px 10px; font-size: 13px;
  border: 1px solid #ddd; border-radius: 10px; background: #fafafa;
  color: #1a1a1a; outline: none;
}
.memo-input:focus { border-color: #E8401C; background: #fff; }

/* Timer display */
.timer-display {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 14px; padding-top: 12px; border-top: 1px solid #f0f0ed;
}
.timer-info { flex: 1; }
.timer-who { font-size: 13px; color: #666; margin-bottom: 2px; min-height: 18px; }
.timer-elapsed { font-size: 30px; font-weight: 600; color: #1a1a1a; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
.timer-starttime { font-size: 11px; color: #aaa; margin-top: 1px; min-height: 15px; }
.btn-toggle {
  width: 72px; height: 72px; border-radius: 50%; border: none; cursor: pointer;
  font-size: 13px; font-weight: 700; flex-shrink: 0;
  background: #E8401C; color: #fff;
  box-shadow: 0 2px 8px rgba(232,64,28,0.3);
  transition: all 0.1s;
}
.btn-toggle.running { background: #555; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
.btn-toggle:active { transform: scale(0.93); }
.btn-toggle:disabled { background: #e0e0e0; color: #aaa; box-shadow: none; cursor: default; }

/* Log section */
.log-section { margin-top: 6px; }
.log-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.log-title { font-size: 15px; font-weight: 600; color: #1a1a1a; }
.btn-clear-log { font-size: 11px; color: #aaa; background: none; border: none; cursor: pointer; padding: 2px 6px; }

.log-empty { text-align: center; color: #bbb; font-size: 13px; padding: 2rem 0; background: #fff; border-radius: 12px; }

.log-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.log-table th { font-size: 10px; color: #aaa; font-weight: 600; padding: 8px 8px 6px; text-align: left; border-bottom: 1px solid #f0f0ed; background: #fafaf8; }
.log-table td { font-size: 12px; color: #333; padding: 9px 8px; border-bottom: 0.5px solid #f5f5f3; vertical-align: middle; }
.log-table tr:last-child td { border-bottom: none; }
.log-name-chip { display: inline-block; background: #1a1a1a; color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 11px; font-weight: 600; }
.log-duration { font-weight: 600; color: #E8401C; }
.btn-delete-row { font-size: 14px; color: #ccc; background: none; border: none; cursor: pointer; padding: 0 2px; }
.btn-delete-row:active { color: #E8401C; }

/* Summary */
.summary-section { margin-top: 14px; }
.summary-grid { display: flex; gap: 10px; flex-wrap: wrap; }
.summary-card { background: #fff; border-radius: 12px; padding: 0.75rem 1rem; flex: 1; min-width: 140px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.summary-card-title { font-size: 10px; color: #aaa; font-weight: 600; margin-bottom: 8px; }
.summary-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 5px; }
.summary-row:last-child { margin-bottom: 0; }
.summary-name { color: #333; }
.summary-min { font-weight: 600; color: #E8401C; }

/* Gantt */
.gantt-section { margin-top: 18px; }
.gantt-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.gantt-title { font-size: 13px; font-weight: 700; color: #333; }
.btn-gantt-toggle { font-size: 12px; color: #fff; background: #534AB7; border: none; border-radius: 20px; padding: 5px 14px; cursor: pointer; font-weight: 600; }

.gantt-banner { background: #534AB7; color: #fff; border-radius: 12px; padding: 10px 16px; font-size: 13px; font-weight: 600; margin-bottom: 12px; text-align: center; }

.gantt-chart { background: #fff; border-radius: 12px; padding: 12px 8px 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden; }
.gantt-axis { display: flex; margin-bottom: 4px; }
.gantt-name-spacer { width: 52px; flex-shrink: 0; }
.gantt-axis-labels { flex: 1; position: relative; height: 18px; }
.gantt-axis-label { position: absolute; font-size: 9px; color: #aaa; transform: translateX(-50%); white-space: nowrap; }
.gantt-row { display: flex; align-items: center; margin-bottom: 6px; }
.gantt-row:last-child { margin-bottom: 0; }
.gantt-name { width: 52px; flex-shrink: 0; font-size: 11px; font-weight: 700; color: #333; text-align: right; padding-right: 8px; }
.gantt-timeline { flex: 1; position: relative; height: 28px; background: #f7f7f5; border-radius: 6px; overflow: visible; }
.gantt-grid-line { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,0.07); pointer-events: none; }
.gantt-bar { position: absolute; top: 3px; bottom: 3px; border-radius: 4px; min-width: 3px; overflow: hidden; cursor: default; opacity: 0.9; }
.gantt-bar:hover { opacity: 1; z-index: 10; }
.gantt-bar-label { font-size: 9px; color: #fff; white-space: nowrap; padding: 0 4px; line-height: 22px; display: block; overflow: hidden; text-overflow: ellipsis; }
.gantt-empty { text-align: center; color: #bbb; font-size: 13px; padding: 1.5rem 0; }

/* Date navigation */
.date-nav { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; }
.btn-date { font-size: 18px; color: #534AB7; background: none; border: none; cursor: pointer; padding: 2px 8px; line-height: 1; }
.btn-date:disabled { color: #ccc; cursor: default; }
.date-nav-label { font-size: 13px; color: #555; font-weight: 600; min-width: 160px; text-align: center; }
.date-nav-today { font-size: 10px; color: #534AB7; background: #EEEDFE; border: none; border-radius: 10px; padding: 2px 8px; cursor: pointer; margin-left: 2px; }

/* Monthly report */
.monthly-section { margin-top: 14px; }
.btn-monthly { font-size: 12px; color: #fff; background: #3B6D11; border: none; border-radius: 20px; padding: 5px 14px; cursor: pointer; font-weight: 600; }
.monthly-header-title { font-size: 14px; font-weight: 700; color: #333; margin-bottom: 12px; }
.monthly-days { background: #fff; border-radius: 12px; padding: 8px 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 10px; }
.monthly-day-row { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 6px 0; border-bottom: 0.5px solid #f0f0ed; }
.monthly-day-row:last-child { border-bottom: none; }
.monthly-day-date { font-weight: 700; color: #333; min-width: 80px; }
.monthly-day-names { flex: 1; color: #777; font-size: 11px; }
.monthly-day-total { font-weight: 600; color: #E8401C; white-space: nowrap; }
.btn-clear-month { display: block; width: 100%; margin-top: 10px; padding: 10px; background: none; border: 1px solid #E8401C; color: #E8401C; border-radius: 10px; font-size: 13px; cursor: pointer; font-weight: 600; }
.btn-clear-month:active { background: #E8401C; color: #fff; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<div class="header">
  <a class="back-link" href="index.html">← トップ</a>
  <div class="page-title">⏱ タイムアタック</div>
  <div class="date-nav">
    <button class="btn-date" id="btn-date-prev" onclick="changeDate(-1)">‹</button>
    <div class="date-nav-label" id="page-date"></div>
    <button class="btn-date" id="btn-date-next" onclick="changeDate(1)" disabled>›</button>
    <button class="date-nav-today" id="btn-today" onclick="goToday()" style="display:none">今日</button>
  </div>
</div>

<div id="timer-slots"></div>

<div class="log-section">
  <div class="log-header">
    <div class="log-title" id="log-title">今日の記録</div>
    <button class="btn-clear-log" onclick="clearLog()">全削除</button>
  </div>
  <div id="log-container"></div>
  <div class="summary-section" id="summary-section" style="display:none"></div>
</div>

<div class="log-section gantt-section" id="gantt-section" style="display:none">
  <div class="gantt-header">
    <div class="gantt-title">📊 日報タイムライン</div>
  </div>
  <div id="gantt-banner"></div>
  <div id="gantt-content"></div>
</div>

<div class="log-section monthly-section" id="monthly-section" style="display:none">
  <div id="monthly-content"></div>
</div>

<div style="padding: 12px 16px 0; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
  <button class="btn-gantt-toggle" onclick="toggleGantt()">📊 日報を見る</button>
  <button class="btn-monthly" onclick="toggleMonthly()">📅 今月のまとめ</button>
</div>

<script>
const NAMES = ['狩俣','下田','まき','布川','星野','北島','わっしー','れみ'];

const PROCESS_GROUPS = [
  { group: 'スマシャキ', procs: ['刈取（スマシャキ）','トリミング（スマシャキ）','袋づめ（スマシャキ）','パウチ（スマシャキ）','播種（スマシャキ）','30穴（スマシャキ）','5穴（スマシャキ）'] },
  { group: 'ハーブ',     procs: ['刈取（ハーブ）','トリミング（ハーブ）','袋づめ（ハーブ）','パウチ（ハーブ）','播種（ハーブ）','30穴（ハーブ）','6穴（ハーブ）'] },
  { group: '共通',       procs: ['ボード洗い','液肥管理','追肥','液肥入替','その他洗い物','掃除','わさび','緑園都市配送','その他'] },
];

function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtTime(d) {
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtElapsed(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
    : `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

const realToday = new Date();
const todayStr = toDateStr(realToday);
let viewDate = todayStr;

function fmtHM(totalMin) {
  if (totalMin < 60) return `${totalMin}分`;
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return m > 0 ? `${h}時間${m}分` : `${h}時間`;
}

function updateDateDisplay() {
  const d = new Date(viewDate + 'T00:00:00');
  const w = ['日','月','火','水','木','金','土'][d.getDay()];
  const isToday = viewDate === todayStr;
  document.getElementById('page-date').textContent =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${w}）`;
  document.getElementById('btn-date-next').disabled = isToday;
  document.getElementById('btn-today').style.display = isToday ? 'none' : '';
  document.getElementById('timer-slots').style.display = isToday ? '' : 'none';
  document.getElementById('log-title').textContent =
    isToday ? '今日の記録' : `${d.getMonth()+1}月${d.getDate()}日の記録`;
}

function changeDate(delta) {
  const d = new Date(viewDate + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  if (d > realToday) return;
  if ((realToday - d) / 86400000 > 31) return;
  viewDate = toDateStr(d);
  updateDateDisplay();
  ganttVisible = false;
  document.getElementById('gantt-section').style.display = 'none';
  document.getElementById('gantt-banner').innerHTML = '';
  monthlyVisible = false;
  document.getElementById('monthly-section').style.display = 'none';
  renderLog();
}

function goToday() {
  viewDate = todayStr;
  updateDateDisplay();
  ganttVisible = false;
  document.getElementById('gantt-section').style.display = 'none';
  document.getElementById('gantt-banner').innerHTML = '';
  monthlyVisible = false;
  document.getElementById('monthly-section').style.display = 'none';
  renderLog();
  checkAutoGantt();
}

// Supabase
const db = supabase.createClient(
  'https://pqoexlikdviqqgdnzuud.supabase.co',
  'sb_publishable_9KR8h4be2Q5-4ux6g55hSg_Jkv9UYBM'
);

// Timer state
const NUM_SLOTS = 3;
let slots = Array.from({length: NUM_SLOTS}, () => ({
  name: null, process: null, memo: '',
  startTime: null, startMs: null, running: false, interval: null
}));

// Log storage (Supabase)
async function loadLog() {
  const { data, error } = await db
    .from('work_logs').select('*').eq('date', viewDate).order('id');
  if (error) { console.error(error); return []; }
  return (data || []).map(r => ({
    id: r.id, name: r.name, process: r.process, memo: r.memo,
    startTime: r.start_time, endTime: r.end_time,
    durationMin: r.duration_min, durationSec: r.duration_sec
  }));
}
async function saveEntry(entry) {
  const { error } = await db.from('work_logs').insert({
    id: entry.id, date: todayStr,
    name: entry.name, process: entry.process, memo: entry.memo,
    start_time: entry.startTime, end_time: entry.endTime,
    duration_min: entry.durationMin, duration_sec: entry.durationSec
  });
  if (error) console.error(error);
}

// Render timer slots
function renderSlots() {
  document.getElementById('timer-slots').innerHTML = slots.map((slot, idx) => `
    <div class="timer-card" id="slot-${idx}">
      <div class="timer-label">タイマー ${idx + 1}</div>

      <div class="section-label">担当</div>
      <div class="btn-group">
        ${NAMES.map(n => `<button class="btn-name${slot.name===n?' active':''}"
          onclick="selectName(${idx},'${n}')" ${slot.running?'disabled':''}>${n}</button>`).join('')}
      </div>

      ${PROCESS_GROUPS.map(g => `
        <div class="section-label">${g.group}</div>
        <div class="btn-group">
          ${g.procs.map(p => `<button class="btn-proc${slot.process===p?' active':''}"
            onclick="selectProcess(${idx},'${p}')" ${slot.running?'disabled':''}>${p}</button>`).join('')}
        </div>
      `).join('')}

      ${slot.process === 'その他' ? `
        <input class="memo-input" type="text" placeholder="内容を入力…"
          value="${slot.memo}" oninput="updateMemo(${idx}, this.value)"
          ${slot.running?'readonly':''} />
      ` : ''}

      <div class="timer-display">
        <div class="timer-info">
          <div class="timer-who">${slot.name && slot.process
            ? `${slot.name} ／ ${slot.process === 'その他' && slot.memo ? slot.memo : slot.process}`
            : '<span style="color:#ccc">名前と工程を選択</span>'}</div>
          <div class="timer-elapsed" id="elapsed-${idx}">
            ${slot.startMs != null ? fmtElapsed(Date.now() - slot.startMs) : '00:00'}
          </div>
          <div class="timer-starttime" id="starttime-${idx}">
            ${slot.startTime ? `開始 ${slot.startTime}` : ''}
          </div>
        </div>
        <button class="btn-toggle${slot.running?' running':''}"
          onclick="toggleTimer(${idx})"
          ${!slot.name || !slot.process ? 'disabled' : ''}>
          ${slot.running ? '■\n停止' : '▶\nスタート'}
        </button>
      </div>
    </div>
  `).join('');
}

function selectName(idx, name) {
  if (slots[idx].running) return;
  slots[idx].name = slots[idx].name === name ? null : name;
  renderSlots();
}

function selectProcess(idx, proc) {
  if (slots[idx].running) return;
  slots[idx].process = slots[idx].process === proc ? null : proc;
  if (proc !== 'その他') slots[idx].memo = '';
  renderSlots();
}

function updateMemo(idx, val) {
  slots[idx].memo = val;
  const whoEl = document.querySelector(`#slot-${idx} .timer-who`);
  if (whoEl && slots[idx].name) {
    whoEl.textContent = `${slots[idx].name} ／ ${val || 'その他'}`;
  }
}

async function toggleTimer(idx) {
  const slot = slots[idx];
  if (!slot.name || !slot.process) return;

  if (!slot.running) {
    slot.startMs = Date.now();
    slot.startTime = fmtTime(new Date());
    slot.running = true;
    slot.interval = setInterval(() => {
      const el = document.getElementById(`elapsed-${idx}`);
      if (el) el.textContent = fmtElapsed(Date.now() - slot.startMs);
    }, 500);
    renderSlots();
  } else {
    clearInterval(slot.interval);
    slot.interval = null;
    const endTime = fmtTime(new Date());
    const durationMs = Date.now() - slot.startMs;
    const entry = {
      id: Date.now(),
      name: slot.name, process: slot.process, memo: slot.memo,
      startTime: slot.startTime, endTime,
      durationMin: Math.round(durationMs / 60000),
      durationSec: Math.floor(durationMs / 1000),
    };
    slot.running = false; slot.name = null; slot.process = null;
    slot.memo = ''; slot.startMs = null; slot.startTime = null;
    renderSlots();
    await saveEntry(entry);
    await renderLog();
  }
}

async function renderLog() {
  const isToday = viewDate === todayStr;
  const container = document.getElementById('log-container');
  container.innerHTML = '<div class="log-empty" style="color:#ccc">読み込み中…</div>';
  const log = await loadLog();
  if (log.length === 0) {
    container.innerHTML = `<div class="log-empty">${isToday ? 'まだ記録がありません' : 'この日の記録はありません'}</div>`;
    document.getElementById('summary-section').style.display = 'none';
    return;
  }
  const rows = [...log].reverse().map(entry => {
    const label = entry.process === 'その他' && entry.memo
      ? `その他（${entry.memo}）` : entry.process;
    const dispMin = entry.durationMin > 0
      ? `${entry.durationMin}分` : `${entry.durationSec}秒`;
    const del = isToday
      ? `<button class="btn-delete-row" onclick="deleteEntry(${entry.id})">✕</button>` : '';
    return `<tr>
      <td><span class="log-name-chip">${entry.name}</span></td>
      <td>${label}</td>
      <td style="white-space:nowrap">${entry.startTime}</td>
      <td style="white-space:nowrap">${entry.endTime}</td>
      <td class="log-duration" style="white-space:nowrap">${dispMin}</td>
      <td>${del}</td>
    </tr>`;
  }).join('');
  container.innerHTML = `<table class="log-table">
    <thead><tr>
      <th>担当</th><th>工程</th><th>開始</th><th>終了</th><th>時間</th><th></th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
  renderSummary(log);
}

function renderSummary(log) {
  const section = document.getElementById('summary-section');
  section.style.display = '';
  const byName = {}, byProc = {};
  log.forEach(e => {
    byName[e.name] = (byName[e.name] || 0) + e.durationMin;
    const label = e.process === 'その他' && e.memo ? `その他（${e.memo}）` : e.process;
    byProc[label] = (byProc[label] || 0) + e.durationMin;
  });
  const nameRows = Object.entries(byName).sort((a,b)=>b[1]-a[1])
    .map(([n,m]) => `<div class="summary-row"><span class="summary-name">${n}</span><span class="summary-min">${fmtHM(m)}</span></div>`).join('');
  const procRows = Object.entries(byProc).sort((a,b)=>b[1]-a[1])
    .map(([p,m]) => `<div class="summary-row"><span class="summary-name" style="font-size:11px">${p}</span><span class="summary-min">${fmtHM(m)}</span></div>`).join('');
  section.innerHTML = `<div class="summary-grid">
    <div class="summary-card"><div class="summary-card-title">担当別 合計時間</div>${nameRows}</div>
    <div class="summary-card"><div class="summary-card-title">工程別 合計時間</div>${procRows}</div>
  </div>`;
}

async function deleteEntry(id) {
  await db.from('work_logs').delete().eq('id', id);
  await renderLog();
}

async function clearLog() {
  const d = new Date(viewDate + 'T00:00:00');
  const label = viewDate === todayStr ? '今日' : `${d.getMonth()+1}月${d.getDate()}日`;
  if (!confirm(`${label}の記録をすべて削除しますか？`)) return;
  await db.from('work_logs').delete().eq('date', viewDate);
  await renderLog();
}

function parseTimeToMin(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function getProcessColor(proc) {
  const sumashaqi = ['刈取（スマシャキ）','トリミング（スマシャキ）','袋づめ（スマシャキ）','パウチ（スマシャキ）','播種（スマシャキ）','30穴（スマシャキ）','5穴（スマシャキ）'];
  const herb = ['刈取（ハーブ）','トリミング（ハーブ）','袋づめ（ハーブ）','パウチ（ハーブ）','播種（ハーブ）','30穴（ハーブ）','6穴（ハーブ）'];
  if (sumashaqi.includes(proc)) return '#534AB7';
  if (herb.includes(proc)) return '#3B6D11';
  return '#E8401C';
}

let ganttVisible = false;

function toggleGantt() {
  ganttVisible = !ganttVisible;
  const sec = document.getElementById('gantt-section');
  sec.style.display = ganttVisible ? '' : 'none';
  if (ganttVisible) renderGantt();
}

async function renderGantt() {
  const log = await loadLog();
  const content = document.getElementById('gantt-content');
  if (log.length === 0) {
    content.innerHTML = '<div class="gantt-empty">まだ記録がありません</div>';
    return;
  }

  const allMins = log.flatMap(e => [parseTimeToMin(e.startTime), parseTimeToMin(e.endTime)]);
  const minTime = Math.min(...allMins, 8 * 60);
  const maxTime = Math.max(...allMins, 17 * 60);
  const span = maxTime - minTime || 60;

  const hours = [];
  for (let h = Math.floor(minTime / 60); h <= Math.ceil(maxTime / 60); h++) hours.push(h);

  const axisHtml = hours.map(h => {
    const pct = ((h * 60 - minTime) / span) * 100;
    return `<div class="gantt-axis-label" style="left:${pct}%">${h}:00</div>`;
  }).join('');

  const byName = {};
  log.forEach(e => {
    if (!byName[e.name]) byName[e.name] = [];
    byName[e.name].push(e);
  });

  const gridLines = hours.map(h => {
    const pct = ((h * 60 - minTime) / span) * 100;
    return `<div class="gantt-grid-line" style="left:${pct}%"></div>`;
  }).join('');

  const rowsHtml = Object.entries(byName).map(([name, entries]) => {
    const bars = entries.map(e => {
      const startMin = parseTimeToMin(e.startTime);
      const endMin = parseTimeToMin(e.endTime);
      const left = ((startMin - minTime) / span) * 100;
      const width = Math.max(((endMin - startMin) / span) * 100, 0.5);
      const color = getProcessColor(e.process);
      const label = e.process === 'その他' && e.memo ? `その他（${e.memo}）` : e.process;
      const dispMin = e.durationMin > 0 ? `${e.durationMin}分` : `${e.durationSec}秒`;
      return `<div class="gantt-bar" style="left:${left}%;width:${width}%;background:${color}"
        title="${label}  ${e.startTime}→${e.endTime}（${dispMin}）">
        <span class="gantt-bar-label">${label}</span>
      </div>`;
    }).join('');
    return `<div class="gantt-row">
      <div class="gantt-name">${name}</div>
      <div class="gantt-timeline">${gridLines}${bars}</div>
    </div>`;
  }).join('');

  content.innerHTML = `<div class="gantt-chart">
    <div class="gantt-axis">
      <div class="gantt-name-spacer"></div>
      <div class="gantt-axis-labels">${axisHtml}</div>
    </div>
    ${rowsHtml}
  </div>`;
}

function checkAutoGantt() {
  if (new Date().getHours() >= 17 && !ganttVisible && viewDate === todayStr) {
    ganttVisible = true;
    document.getElementById('gantt-section').style.display = '';
    document.getElementById('gantt-banner').innerHTML =
      '<div class="gantt-banner">📊 17時です！今日の日報をチェックしましょう</div>';
    renderGantt();
  }
}

// Monthly report
let monthlyVisible = false;

function toggleMonthly() {
  monthlyVisible = !monthlyVisible;
  document.getElementById('monthly-section').style.display = monthlyVisible ? '' : 'none';
  if (monthlyVisible) renderMonthly();
}

async function renderMonthly() {
  const ym = viewDate.substring(0, 7);
  const content = document.getElementById('monthly-content');
  content.innerHTML = '<div class="gantt-empty" style="color:#ccc">読み込み中…</div>';
  const { data, error } = await db
    .from('work_logs').select('*')
    .gte('date', `${ym}-01`).lte('date', `${ym}-31`).order('date').order('id');
  if (error || !data || data.length === 0) {
    content.innerHTML = '<div class="gantt-empty">この月の記録はありません</div>';
    return;
  }
  const allEntries = data.map(r => ({
    id: r.id, name: r.name, process: r.process, memo: r.memo,
    startTime: r.start_time, endTime: r.end_time,
    durationMin: r.duration_min, durationSec: r.duration_sec, date: r.date
  }));
  const byName = {}, byProc = {}, dayLogs = {};
  allEntries.forEach(e => {
    byName[e.name] = (byName[e.name] || 0) + e.durationMin;
    const label = e.process === 'その他' && e.memo ? `その他（${e.memo}）` : e.process;
    byProc[label] = (byProc[label] || 0) + e.durationMin;
    if (!dayLogs[e.date]) dayLogs[e.date] = [];
    dayLogs[e.date].push(e);
  });
  const nameRows = Object.entries(byName).sort((a,b)=>b[1]-a[1])
    .map(([n,m]) => `<div class="summary-row"><span class="summary-name">${n}</span><span class="summary-min">${fmtHM(m)}</span></div>`).join('');
  const procRows = Object.entries(byProc).sort((a,b)=>b[1]-a[1])
    .map(([p,m]) => `<div class="summary-row"><span class="summary-name" style="font-size:11px">${p}</span><span class="summary-min">${fmtHM(m)}</span></div>`).join('');
  const dayRows = Object.entries(dayLogs).sort().map(([dateStr, entries]) => {
    const d = new Date(dateStr + 'T00:00:00');
    const wday = ['日','月','火','水','木','金','土'][d.getDay()];
    const totalMin = entries.reduce((s,e) => s + e.durationMin, 0);
    const names = [...new Set(entries.map(e => e.name))].join('・');
    return `<div class="monthly-day-row">
      <span class="monthly-day-date">${d.getMonth()+1}/${d.getDate()}（${wday}）</span>
      <span class="monthly-day-names">${names}</span>
      <span class="monthly-day-total">${fmtHM(totalMin)}</span>
    </div>`;
  }).join('');
  const [y, m2] = ym.split('-');
  const days = Object.keys(dayLogs).length;
  content.innerHTML = `
    <div class="monthly-header-title">${y}年${parseInt(m2)}月 まとめ（${days}日分）</div>
    <div class="summary-grid" style="margin-bottom:12px">
      <div class="summary-card"><div class="summary-card-title">担当別 合計時間</div>${nameRows}</div>
      <div class="summary-card"><div class="summary-card-title">工程別 合計時間</div>${procRows}</div>
    </div>
    <div class="monthly-days">${dayRows}</div>
    <button class="btn-clear-month" onclick="clearMonth('${ym}')">この月のデータを削除</button>
  `;
}

async function clearMonth(ym) {
  const [y, m2] = ym.split('-');
  if (!confirm(`${y}年${parseInt(m2)}月の全データを削除しますか？\nこの操作は元に戻せません。`)) return;
  await db.from('work_logs').delete().gte('date', `${ym}-01`).lte('date', `${ym}-31`);
  monthlyVisible = false;
  document.getElementById('monthly-section').style.display = 'none';
  await renderLog();
}

// リアルタイム同期
db.channel('work_logs_changes')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'work_logs' }, () => {
    renderLog();
    if (ganttVisible) renderGantt();
    if (monthlyVisible) renderMonthly();
  })
  .subscribe();

updateDateDisplay();
renderSlots();
renderLog();
checkAutoGantt();
setInterval(checkAutoGantt, 60000);
</script>
