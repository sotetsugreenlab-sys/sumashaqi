// ===== ユーティリティ =====
function fmt(d) {
  const w = ['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${w}）`;
}
function fmtShort(d) { return `${d.getMonth()+1}/${d.getDate()}`; }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function toDateStr(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); }
function isSameDay(a, b) { return toDateStr(a) === toDateStr(b); }
function isValidSow(herb, date) {
  const ds = toDateStr(date);
  const cutoff = herb.sowCutoff ?? herb.sowDates[herb.sowDates.length - 1];
  const validDay = herb.sowDays ? herb.sowDays.includes(date.getDay()) : (date.getDay()===1||date.getDay()===5);
  return herb.sowDates.includes(ds) || (cutoff !== undefined && ds > cutoff && validDay);
}
function getStagesForSow(herb, sow) {
  if (herb.stagesNewFrom && herb.stages2 && toDateStr(sow) >= herb.stagesNewFrom) return herb.stages2;
  return herb.stages;
}
function getBagCount(herb, date) {
  if (!herb.bagBase) return null;
  const diff = Math.round((parseDate(toDateStr(date)) - parseDate(herb.bagBase.date)) / 86400000);
  return Math.max(0, herb.bagBase.count - diff);
}

];
const TRAY_REF = new Date('2026-10-08T00:00:00Z');
function sowTrayStyle(sow) {
  const d = new Date(sow); d.setHours(0,0,0,0);
  const r = new Date(TRAY_REF); r.setHours(0,0,0,0);
  return TRAY_STYLES[((Math.round((d-r)/86400000) % 6) + 6) % 6];
}

    shiftsCache[r.shift_date] = {
      cult: r.cultivation_staff || [],

  });
  renderInfoBar();
}

const EKIHI_BASE = new Date(2026, 10, 17); // 2026-11-17 追肥の基準日
const EKIHI_EVENTS = [
  { label: '追肥', offset: 0 },
  { label: '入替', offset: 5 },
];

function getEkihiLabel(date) {
  const ms = new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
  const daysSinceBase = Math.round((ms - EKIHI_BASE.getTime()) / 86400000);
  if (daysSinceBase < 0) return '通常';
  const cycleNum = Math.floor(daysSinceBase / 10);
  const hit = EKIHI_EVENTS.find(e => (cycleNum * 10 + e.offset) === daysSinceBase);
  return hit ? hit.label : '通常';
}

function renderInfoBar() {
  const dateStr = toDateStr(viewDate);
  const shift = shiftsCache[dateStr];

  // シフト（ヘッダー内）
  const staffEl = document.getElementById('staff-line');
  if (shift && (shift.cult.length > 0 || shift.other.length > 0 || shift.delivery.length > 0)) {

      ...shift.other.map(n => `<span style="color:#3B8A28;font-weight:700">${n}</span>`),
      ...shift.cult.map(n => `<strong>${n}</strong>`),
      ...shift.delivery.map(n => `<span style="color:#E8830A;font-weight:700">${n}</span>`),
    ];
    staffEl.innerHTML = parts.join('・');
  } else {
    staffEl.innerHTML = '';

  // 液肥管理（ヘッダー内、常時表示）

  header.style.border = ts.border || '';

  (alertRes.data || []).forEach(r => { smAlerts[r.sow_date] = r.id; });
  renderAll();
}

async function toggleSmAlert(sowDate) {
  if (smAlerts[sowDate]) {
    await db.from('lot_notes').delete().eq('id', smAlerts[sowDate]);
    delete smAlerts[sowDate];
  } else {
    const { data } = await db.from('lot_notes').insert({ crop: 'sumashaqi_alert', sow_date: sowDate, note: '1' }).select('id');
    if (data?.[0]) smAlerts[sowDate] = data[0].id;
  }
  renderSumashaqi();
}

// ===== ハーブ ノート =====
let herbNotes = {};

async function loadHerbNotes() {
  const cropNames = HERBS.filter(h => !h.nameOnly).map(h => h.name);
  const { data } = await db.from('lot_notes').select('id,crop,sow_date,note').in('crop', cropNames);
  herbNotes = {};
  (data || []).forEach(r => {
    const key = r.crop + ':' + r.sow_date;
    if (!herbNotes[key]) herbNotes[key] = [];
    herbNotes[key].push({ id: r.id, note: r.note });
  });
  renderHerbs();
}

// ===== メモ 操作 =====
function openNote(id) { document.getElementById(id).classList.add('open'); document.getElementById(id+'-t').focus(); }
function closeNote(id) { document.getElementById(id).classList.remove('open'); }

async function submitSmNote(sowDate) {
  const id = 'smni-' + sowDate;
  const input = document.getElementById(id+'-t');
  const text = input.value.trim();
  if (!text) return;
  const { data } = await db.from('lot_notes').insert({ crop: 'sumashaqi', sow_date: sowDate, note: text }).select('id');
  if (!smNotes[sowDate]) smNotes[sowDate] = [];
  smNotes[sowDate].push({ id: data?.[0]?.id, note: text });
  input.value = '';
  closeNote(id);
  renderSumashaqi();
}

async function submitHerbNote(crop, sowDate) {
  const id = 'hni-' + crop + '-' + sowDate;
  const input = document.getElementById(id+'-t');
  const text = input.value.trim();
  if (!text) return;
  const { data } = await db.from('lot_notes').insert({ crop, sow_date: sowDate, note: text }).select('id');
  const key = crop + ':' + sowDate;
  if (!herbNotes[key]) herbNotes[key] = [];
  herbNotes[key].push({ id: data?.[0]?.id, note: text });
  input.value = '';
  closeNote(id);
  renderHerbs();
}

async function deleteNote(noteId, type, key) {
  await db.from('lot_notes').delete().eq('id', noteId);
  if (type === 'sm') {
    if (smNotes[key]) smNotes[key] = smNotes[key].filter(n => n.id !== noteId);
    renderSumashaqi();
  } else {
    if (herbNotes[key]) herbNotes[key] = herbNotes[key].filter(n => n.id !== noteId);
    renderHerbs();
  }
}

function showDeleteConfirm(noteId) { document.getElementById('dc-'+noteId).style.display = 'flex'; }
function hideDeleteConfirm(noteId) { document.getElementById('dc-'+noteId).style.display = 'none'; }

function smNotesHtml(sowDate) {
  const notes = smNotes[sowDate] || [];
  const id = 'smni-' + sowDate;
  const isAlert = !!smAlerts[sowDate];
  const items = notes.map(n => `
    <div class="card-note-item">📝 ${n.note}
      <button class="btn-note-edit" onclick="deleteNote(${n.id},'sm','${sowDate}')">削除</button>
    </div>
    <div class="note-delete-confirm" id="dc-${n.id}" style="display:none">
      <span class="note-delete-label">本当に削除？</span>
      <button class="btn-note-save" style="background:#E24B4A" onclick="deleteNote(${n.id},'sm','${sowDate}')">はい</button>
      <button class="btn-note-cancel" onclick="hideDeleteConfirm(${n.id})">いいえ</button>
    </div>`).join('');
  return `<div class="card-notes">
    ${items}
    <div id="${id}" class="note-input-wrap">
      <input class="note-input" id="${id}-t" placeholder="メモを入力…" onkeydown="if(event.key==='Enter')submitSmNote('${sowDate}')">
      <button class="btn-note-save" onclick="submitSmNote('${sowDate}')">保存</button>
      <button class="btn-note-cancel" onclick="closeNote('${id}')">✕</button>
    </div>
    <button class="btn-note-add" onclick="openNote('${id}')">＋ メモ</button>
    <button class="btn-alert${isAlert?' active':''}" onclick="toggleSmAlert('${sowDate}')">⚠️ 注意</button>
  </div>`;
}

function herbNotesHtml(herbName, sowDateStr) {
  const key = herbName + ':' + sowDateStr;
  const notes = herbNotes[key] || [];
  const id = 'hni-' + herbName + '-' + sowDateStr;
  const items = notes.map(n => `
    <div class="card-note-item">📝 ${n.note}
      <button class="btn-note-edit" onclick="deleteNote(${n.id},'herb','${key}')">削除</button>
    </div>`).join('');
  return `<div class="card-notes">
    ${items}
    <div id="${id}" class="note-input-wrap">
      <input class="note-input" id="${id}-t" placeholder="メモを入力…" onkeydown="if(event.key==='Enter')submitHerbNote('${herbName}','${sowDateStr}')">
      <button class="btn-note-save" onclick="submitHerbNote('${herbName}','${sowDateStr}')">保存</button>
      <button class="btn-note-cancel" onclick="closeNote('${id}')">✕</button>
    </div>
    <button class="btn-note-add" onclick="openNote('${id}')">＋ メモ</button>
  </div>`;
}

// ===== スマシャキ レンダリング =====
// 今日作業が発生する節目の日数
const SM_STAGES = [
  { days: 32, label: '刈取',      cls: 'card-harvest' },
  { days: 31, label: '前借り',    cls: 'card-yellow'  },
  { days: 17, label: '4穴へ移植', cls: 'card-5ana'    },
  { days: 6,  label: '32穴へ移植',cls: 'card-30'      },
];

function renderSumashaqi() {
  const dateStr = toDateStr(viewDate);

  function daysFromSow(sowDate) {
    return Math.round((parseDate(dateStr) - parseDate(sowDate)) / 86400000);
  }

  // 全ステージ：今日から逆算した播種日で固定表示（v3と同じ方式）
  function smCard(label, cls, days) {
    const sowDate = toDateStr(addDays(viewDate, -days));
    const st = sowTrayStyle(parseDate(sowDate));
    const borderStyle = st.border ? `;border:${st.border}` : '';
    const alertStyle = smAlerts[sowDate] ? ';outline:2px solid #E24B4A' : '';
    return `<div class="harvest-col">
      <div class="harvest-col-title">${days}日目 ${label}</div>
      <div class="card ${cls}" style="background:${st.bg}${borderStyle}${alertStyle}">
        ${smAlerts[sowDate] ? '<div class="card-alert-badge">⚠️ 注意ロット</div>' : ''}
        <div class="card-task">${label}</div>
        <div class="card-sow">${fmtShort(parseDate(sowDate))}播種</div>
        <div class="card-sub">${days}日目</div>
        ${smNotesHtml(sowDate)}
      </div>
    </div>`;
  }

  document.getElementById('sumashaqi-section').innerHTML = `
    <div class="sumashaqi-section">
      <div class="section-header">
        <span class="section-title sumashaqi">🌱 スマシャキ</span>
        <a class="section-link" href="sumashaqi_daily_schedule_v3.html">数値報告 →</a>
      </div>
      <div class="harvest-row">
        ${smCard('前借り',    'card-yellow',  31)}
        ${smCard('刈取',      'card-harvest', 32)}
      </div>
      <div class="harvest-row">
        ${smCard('32穴へ移植','card-30',       6)}
        ${smCard('4穴へ移植', 'card-5ana',    17)}
      </div>
    </div>`;
}

// ===== ハーブ レンダリング =====
function renderHerbs() {
  let html = '';
  const activeHerbs = HERBS.filter(h => !h.nameOnly);
  const nameOnlyHerbs = HERBS.filter(h => h.nameOnly);

  activeHerbs.forEach(herb => {
    const sowToday = isValidSow(herb, viewDate);
    const allStageSets = [herb.stages, ...(herb.stages2 ? [herb.stages2] : [])];

    // 収穫カード：今日から逆算した3日分（harvest_days〜harvest_days+2）を範囲表示
    const harvestDayValues = [...new Set(allStageSets.map(s => s[0].days))];
    const hDays = harvestDayValues[0];
    const appStagesRef = getStagesForSow(herb, addDays(viewDate, -hDays));
    const harvestCls = appStagesRef[0].cls;
    const sowNewest = addDays(viewDate, -hDays);
    const sowOldest = addDays(viewDate, -(hDays + 2));
    const harvestCellHtml = `<div class="card ${harvestCls}">
      <div class="card-task">収穫</div>
      <div class="card-sow">${fmtShort(sowOldest)}〜${fmtShort(sowNewest)}播種</div>
      <div class="card-sub">${hDays}日目</div>
    </div>`;

    const refStages = (herb.stages2 || herb.stages).slice(1);
    const otherCells = refStages.map(refStage => {
      const cards = [];
      const seenSow = new Set();
      allStageSets.forEach(stageSet => {
        const stage = stageSet.slice(1).find(s => s.days === refStage.days);
        if (!stage) return;
        const sow = addDays(viewDate, -stage.days);
        const sowStr = toDateStr(sow);
        if (seenSow.has(sowStr) || !isValidSow(herb, sow)) return;
        const appStages = getStagesForSow(herb, sow);
        const match = appStages.slice(1).find(s => s.days === stage.days);
        if (match) {
          seenSow.add(sowStr);
          const st = sowTrayStyle(sow);
          const borderStyle = st.border ? `;border:${st.border}` : '';
          cards.push(`<div class="card ${match.cls}" style="background:${st.bg}${borderStyle}">
            <div class="card-task">${match.label}</div>
            <div class="card-sow">${fmtShort(sow)}播種</div>
            <div class="card-sub">${match.days}日目</div>
            ${match.boards ? `<div class="card-sub" style="color:#534AB7;font-weight:700;font-size:11px">${match.boards}ボード</div>` : ''}
            ${herbNotesHtml(herb.name, sowStr)}
          </div>`);
        }
      });
      const inner = cards.length
        ? `<div class="harvest-stack">${cards.join('')}</div>`
        : `<div class="card-empty"><span class="card-empty-text">−</span></div>`;
      return `<div class="stage-cell">${inner}</div>`;
    });

    const hasTask = harvestCards.length > 0 ||
      allStageSets.some(stageSet =>
        stageSet.slice(1).some(s => {
          const sow = addDays(viewDate, -s.days);
          if (!isValidSow(herb, sow)) return false;
          return getStagesForSow(herb, sow).slice(1).some(as => as.days === s.days);
        })
      );
    const bagCount = getBagCount(herb, viewDate);
    const bagHtml = bagCount !== null
      ? `<span class="herb-bag${bagCount <= 3 ? ' low' : ''}">袋 <strong>${bagCount}</strong>組</span>`
      : '';

    html += `<div class="herb-section">
      <a class="herb-header" href="${herb.href}" style="color:${herb.color}">
        <span>${herb.name}${herb.seeds != null ? `<span class="herb-seeds">${herb.seeds}粒${herb.cubes ? `×${herb.cubes}キューブ` : ''}</span>` : ''}</span>
        ${bagHtml}<span class="herb-arrow">›</span>
      </a>
      ${hasTask
        ? `<div class="stage-row">${[...otherCells].reverse().join('')}<div class="stage-cell">${harvestCellHtml}</div></div>`
        : (sowToday ? '' : '<div class="no-task-inline">本日の作業なし</div>')
      }
    </div>`;
  });

  if (nameOnlyHerbs.length) {
    html += `<div class="name-only-section">
      <div class="name-only-title">その他のハーブ</div>
      <div class="name-only-list">${nameOnlyHerbs.map(h =>
        `<a class="name-only-item" href="${h.href}" style="color:${h.color}">${h.name}</a>`
      ).join('')}</div>
    </div>`;
  }

  document.getElementById('herb-section').innerHTML = html;
}

function renderAll() {
  renderHeader();
  renderInfoBar();
  renderSumashaqi();
  renderHerbs();
}

renderAll();
loadShifts();
